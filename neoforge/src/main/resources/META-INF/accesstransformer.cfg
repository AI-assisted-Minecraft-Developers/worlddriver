# NeoForge counterpart of common/src/main/resources/worlddriver.accesswidener.
#
# Two files, because architectury-loom 1.11's NeoForge extension has NO
# AW->AT conversion: NeoForgeExtensionAPI exposes only accessTransformer(Object) /
# getAccessTransformers(). (`convertAccessWideners` + `extraAccessWideners` exist on
# ForgeExtensionAPI only — setting them here fails with "Could not set unknown
# property 'convertAccessWideners'".) So the widened members are declared twice, and
# scripts/check_remap_safety.py asserts the two lists stay identical — that check is
# the only thing standing between here and a member that is open on one loader and
# private on the other.
#
# Names are Mojang-mapped, matching NeoForge's own bundled accesstransformer.cfg
# (e.g. `public-f net.minecraft.client.Options keyMappings`). Fields take no
# descriptor; methods do.
public net.minecraft.client.MouseHandler xpos
public net.minecraft.client.MouseHandler ypos
public net.minecraft.client.multiplayer.MultiPlayerGameMode destroyProgress
public net.minecraft.client.gui.components.AbstractSliderButton value
public net.minecraft.client.gui.components.AbstractSliderButton applyValue()V
public net.minecraft.client.gui.components.AbstractSliderButton updateMessage()V
public net.minecraft.client.KeyboardHandler keyPress(JIIII)V
public net.minecraft.client.gui.screens.DeathScreen causeOfDeath
public net.minecraft.client.gui.components.AbstractSelectionList getRowTop(I)I
public net.minecraft.client.gui.components.AbstractSelectionList itemHeight
public net.minecraft.client.gui.screens.inventory.AbstractContainerScreen leftPos
public net.minecraft.client.gui.screens.inventory.AbstractContainerScreen topPos
