plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        name = 'latvian-releases'
        url = 'https://maven.latvian.dev/releases'
        // Fenced for the reason given in common/build.gradle.
        content { includeGroup 'dev.latvian.mods' }
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"
    // Required mod (neoforge.mods.toml dependency), not nested: the player installs it alongside.
    modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    // DEV-ONLY: put the StageWright mod on the dev run classpath so dogfoodServer /
    // every headless run boots with both mods, the way a production install would
    // (worlddriver.jar + stagewright.jar side by side). `modLocalRuntime` is never published
    // and never bundled — it is the build-graph equivalent of `testImplementation junit`.
    // A `mod*` configuration, so loom DOES remap this one: the published jar is
    // intermediary and the dev runtime needs named. That is the opposite of the `:dev`
    // classifier :common's testmod compile uses, and both are right for their side.
    // `changing = true` because this arrives from mavenLocal, where the version string stays put
    // while the contents move under it. Without it, loom's remap cache is keyed on coordinates and
    // happily serves the jar it remapped days ago: a republished harness looks applied, the build
    // succeeds, and the run behaves like the old code. That failure mode cost a 45-minute gate run
    // to find — the suite completed, the fix that was supposed to end the JVM was simply not in the
    // jar that ran. See the matching resolutionStrategy in the root build.
    // -PworlddriverBootstrap skips it: a clean box publishes :common before StageWright exists.
    if (!providers.gradleProperty('worlddriverBootstrap').isPresent()) {
        modLocalRuntime("net.magicterra:mc_stagewright-neoforge:${rootProject.stagewright_version}") {
            changing = true
        }
    }

    // NOTE: stagewright-common is deliberately NOT bundled here. It used to be, which is what
    // put the whole test harness inside the shipped worlddriver jar and forced the driver to
    // forward server lifecycle into it. StageWright is its own mod — its neoforge module ships a
    // neoforge.mods.toml — and it depends on worlddriver, not the other way round.

    // Rhino (KubeJS fork) — a full mod jar (ships neoforge.mods.toml), so we
    // nest it via Jar-in-Jar instead of shadowing its classes. FML discovers the
    // nested mod and DEDUPES it by version against any other mod that JiJ's the
    // same Rhino (e.g. KubeJS) — only the highest version loads, shared by all.
    // `implementation` keeps it on the dev/compile classpath (its mod metadata
    // makes FML pick it up in dev runs); `include` performs the JiJ nesting.
    implementation "dev.latvian.mods:rhino:$rootProject.rhino_version"
    include "dev.latvian.mods:rhino:$rootProject.rhino_version"

    // netty-codec-http for WebSocket support. NeoForge's ModuleClassLoader will
    // NOT see plain `implementation` jars at runtime (FML only discovers mods,
    // not arbitrary classpath libraries). `forgeRuntimeLibrary` adds the jar to
    // FML's bootstrap classpath so it joins the module graph in dev runs; the
    // matching `include` nests it (Jar-in-Jar) as a library jar in the prod jar.
    // transitive=false so we ship only codec-http and reuse MC's netty core.
    // See https://docs.architectury.dev/loom/using_libraries
    include("io.netty:netty-codec-http:$rootProject.netty_version") { transitive = false }
    forgeRuntimeLibrary "io.netty:netty-codec-http:$rootProject.netty_version"

}

// testmod source set — EMPTY-SOURCE BRIDGE (P4-final). The legacy @GameTest classes
// once lived here (P4a-P4c) so they compiled/loaded ONLY in dev runs, never in the
// production jar; P4b/P4c migrated every arena to a dogfooded wd.* testkit scene under
// :common's testmod and P4-final retired the GameTestServer run machinery. This source
// set now carries NO test java of its own — it survives purely as the delivery vehicle
// that folds :common's testmod OUTPUT+resources into worlddriver's dev-run module (via
// the loom mods{} block below) and onto the `source sourceSets.testmod` runs
// (runDogfoodServer and the self-driving topologies) so ServiceLoader discovers the wd.*
// scenes. Deleting it would silently drop all scene delivery — keep it.
// Classpath wiring mirrors the stagewright gradle-plugin's
// testmod convention (testmod sees main's OUTPUT plus main's own compile/runtime
// classpaths — so testmod code can reach main classes AND main's dependencies,
// including common's SimProbes), but wired by hand: the plugin's testmodSourceSet
// flag only takes effect on the root project (P4a plan §Architecture).
// P4a Task 2: neoforge testmod must COMPILE against :common's testmod OUTPUT. The
// wd.* scene + probe helpers moved there (SimProbes, referenced by
// AgentGameTestSupport:122 and AgentGameTestServer:~2534/~2544; WorldDriverScenes'
// SceneProvider service file too), so they are NO LONGER in :common namedElements
// (main output) that testmod's main-classpath extension already sees. We add
// :common's testmod output to the COMPILE classpath only (classesDirs so javac
// resolves SimProbes). evaluationDependsOn forces :common to configure first so its
// sourceSets.testmod is resolvable here.
//
// It is DELIBERATELY NOT on runtimeClasspath: at RUNTIME :common's testmod is
// delivered by the loom `mods { named('main') { sourceSet ..., project(':common') } }`
// block below, which folds its output into worlddriver's fml.modFolders group (one
// module, unioned with the moved-package's siblings in :common main). Putting it on
// runtimeClasspath too would ALSO expose it as a bare -classpath dir that FML's
// userdev locator re-packages into a second synthetic module (generated_XXX) — and
// two modules exporting net.magicterra.worlddriver.bot.stagewright is a hard
// java.lang.module.ResolutionException at boot (diagnosed live: run-dogfood ModuleLayerHandler).
// Compile-only stays dev-only and never reaches any jar/publication.
evaluationDependsOn(':common')
sourceSets {
    testmod {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output + project(':common').sourceSets.testmod.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

processResources {
    // One map for both roles on purpose. A value that expands without also being a declared
    // input leaves the task up-to-date across a gradle.properties edit, so the jar keeps
    // shipping the previous metadata — how a license change once stopped at the toml.
    def expansions = [
            version                : project.version,
            minecraft_version_range: rootProject.minecraft_version_range,
            neoforge_version_range : rootProject.neoforge_version_range,
            loader_version_range   : rootProject.loader_version_range,
            mod_license            : rootProject.mod_license,
            mod_authors            : rootProject.mod_authors,
            mod_description        : rootProject.mod_description,
    ]
    expansions.each { key, value -> inputs.property key, value }

    filesMatching('META-INF/neoforge.mods.toml') {
        expand expansions
    }
}

shadowJar {
    // Shadow now only merges the multi-platform `common` sources into the
    // platform jar (Architectury requires this). External libraries (Rhino,
    // netty-codec-http) are nested via Jar-in-Jar (`include`) instead
    // of being shadowed/relocated, so there is no `relocate` rule here anymore.
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

loom {
    // NeoForge uses access transformers, and architectury-loom 1.11 does NOT convert
    // access wideners for it (ForgeExtensionAPI has convertAccessWideners /
    // extraAccessWideners; NeoForgeExtensionAPI has neither — only accessTransformer).
    // So the same members are declared a second time in AT form; the two files are
    // kept in lockstep by scripts/check_remap_safety.py, not by the build.
    neoForge {
        accessTransformer file("src/main/resources/META-INF/accesstransformer.cfg")
    }

    // P4a Task 1: attach the testmod source set to the mod FML scans, so :common's
    // testkit scene classes and their SceneProvider service entries are discovered as
    // part of worlddriver (no separate mods.toml). architectury-loom EAGERLY registers a
    // default dev-run mod named "main" (the main source set) during plugin apply, before
    // this script body runs — so we must CONFIGURE that existing "main" mod, not create a
    // second one. (Declaring a new `worlddriver` mod instead produces two MOD_CLASSES
    // groups — main-only "main" + main+testmod "worlddriver" — and FML resolves the
    // duplicate mods.toml to the main-only group, silently dropping testmod. Verified via
    // the launch MOD_CLASSES env + "Found mod file main" in the boot log.)
    mods {
        named('main') {
            sourceSet sourceSets.testmod
            // P4a Task 2: the wd.* dogfood scenes + SimProbes + SceneProvider service moved
            // to :common's testmod. Two facts force the exact wiring here:
            //   1. DISCOVERY. A bare -classpath dir is auto-moduled by FML on the game/library
            //      layer, which worlddriver does NOT read — so ServiceLoader(SceneProvider),
            //      run on the server thread in the mod's context, can't see the service file
            //      (verified live: run-dogfood registered NO wd.* scenes). Attaching the
            //      cross-project source set to THIS mod entry (loom's `sourceSet(SourceSet,
            //      Project)` overload) folds :common's testmod OUTPUT into worlddriver's
            //      fml.modFolders group — the same module the scenes are discovered from —
            //      exactly as the line above does for neoforge's own testmod.
            //   2. NO SPLIT PACKAGE. The moved classes live in package
            //      net.magicterra.worlddriver.bot.stagewright.SCENE, DISJOINT from
            //      net.magicterra.worlddriver.bot.stagewright (TestResetVerb/TestRunVerb, which stay in
            //      :common MAIN and are delivered as their own dev module). FML wires broad
            //      `reads` edges between mod modules, so two modules exporting the SAME package
            //      is a hard java.lang.module.ResolutionException at boot (diagnosed live:
            //      worlddriver + the common-main dev module both exporting the un-suffixed
            //      package). The `.scene` sub-package keeps each package owned by exactly one
            //      module — see the report for why the brief's identical-package layout is
            //      unsatisfiable under JPMS and this is the minimal deviation.
            // Per-run scoping holds: loom emits modFolders only for source sets on a run's
            // classpath, so contractServer/server (no `source testmod`) never receive the
            // scenes — the scene-independence of the instrument contract stands.
            sourceSet project(':common').sourceSets.testmod, project(':common')
        }
    }
    runs {
        server { server() }
        contractServer {
            server()
            property 'worlddriver.contractRun', 'true'
            property 'worlddriver.rpcPort', '0'
            property 'worlddriver.mcpPort', '0'
            runDir 'run-contract'
            vmArg '-Xmx1g'
        }
        // P1c: dogfood run — boots a professional dedicated server with BOTH
        // worlddriver and the stagewright harness loaded, autorun gate ON. This
        // is what proves the harness generalizes beyond its
        // own bare-bones stagewright-neoforge module to a real, feature-loaded mod.
        dogfoodServer {
            server()
            property 'stagewright.autorun', 'true'
            runDir 'run-dogfood'
            vmArg '-Xmx2g'
            // P4a Task 2: the wd.* dogfood scenes + SceneProvider service moved to
            // :common's testmod, routed onto neoforge testmod's runtimeClasspath
            // above. `source sourceSets.testmod` puts that output+resources on this
            // run so ServiceLoader discovers WorldDriverScenes and the 9 scenes run.
            // (contractServer is deliberately NOT given this — the instrument
            // contract is scene-independent by design.)
            source sourceSets.testmod
        }
        // These replaced the orchestrator-driven pair (stagewrightClient in run-t1, t2Server in
        // run-t2), deleted along with the scripts that drove them from outside. The only
        // process remains: the last two went on 2026-08-05.
        //
        // Everything the orchestrators used to supply — enter a world, dial a server, wait for a
        // player, exit when finished — is a system property the harness reads for itself.

        // Integrated-server topology: a client that opens its own singleplayer world, whose
        // integrated server arms the same harness the dedicated one does.
        stagewrightIntegratedServer {
            client()
            property 'stagewright.autorun', 'true'
            // ⚠️ THIS TOPOLOGY NO LONGER VARIES ONLY THE RUN, and that is now on purpose. The
            // 2026-08-20 body-selection instruction puts JoinedBody on the DEDICATED server only, so
            // `SceneBody` refuses to mint one here and every scene that needs a headless body is a
            // recorded skip until its family is converted to the client helm.
            // The old doctrine「a topology must vary the RUN, never the subject」still applies to
            // every OTHER pair of topologies, and it is why the skips have to be reconciled against
            // the dedicated gate rather than counted as coverage.
            // The suite arms at SERVER_STARTED, which here is before the local player is placed;
            // without this a run could start with no client at all and still look like a client run.
            property 'stagewright.awaitPlayer', 'true'
            property 'stagewright.client.world', 'StageWrightClient'
            property 'stagewright.client.exitWhenDone', 'true'
            property 'worlddriver.rpcPort', '0'
            property 'worlddriver.mcpPort', '0'
            runDir 'run-stagewright-integrated'
            vmArg '-Xmx2g'
            source sourceSets.testmod
        }
        // Production topology, server half: holds the suite back until a real client has joined.
        stagewrightDedicatedServerWithClient {
            server()
            programArgs '--nogui', '--port', '25602'
            property 'stagewright.autorun', 'true'
            property 'stagewright.awaitPlayer', 'true'
            property 'worlddriver.rpcPort', '0'
            property 'worlddriver.mcpPort', '0'
            runDir 'run-stagewright-with-client'
            vmArg '-Xmx2g'
            source sourceSets.testmod
        }
        // Production topology, client half. Started by the plugin as a companion of the server
        // above; it runs no scenes of its own, it only has to be a real player.
        stagewrightJoiningClient {
            client()
            property 'stagewright.client.connect', '127.0.0.1:25602'
            property 'worlddriver.rpcPort', '0'
            property 'worlddriver.mcpPort', '0'
            runDir 'run-stagewright-joining-client'
            vmArg '-Xmx2g'
            // The testmod registers the marker block and items, so a client without it is refused at
            // registry sync and the server waits for a player forever.
            source sourceSets.testmod
        }
    }
    runConfigs.configureEach {
        // contractServer manages its own -Xmx (1g), so exclude it from the guard's default
        // heap/runValidation pinning below. The three self-driving topologies do the same.
        if (it.name == 'contractServer'
                || it.name.startsWith('stagewrightIntegrated')
                || it.name.startsWith('stagewrightDedicated')
                || it.name.startsWith('stagewrightJoining')) return
        // The validation startup hook ships with the testmod, so only a run carrying it can honour the flag.
        if (it.getSource(project) == sourceSets.testmod) {
            property 'worlddriver.runValidation', project.findProperty('agentRunValidation') ?: 'false'
        }        // Cap heap so the dogfood/testkit server runs don't trigger system OOM.
        vmArg '-Xmx2g'
    }
}

// The scene scripts a modpack author would ship, delivered into the dogfood run the way a pack
// delivers them: config/stagewright/scenes. The gate task provisions these itself, so this is for
// the BARE `:neoforge:runDogfoodServer`; that path drives runDogfoodServer directly rather than one
// of the stagewright plugin's topology tasks, so the plugin's own sceneScripts provisioning never
// runs for this gate — without this the run reads whatever copy was last left in the directory. It
// read a two-day-old one, and the expect-file gate caught it only because a scene had been added.
// Sync rather than Copy: a scene deleted upstream must not keep running here.
def installDogfoodScenes = tasks.register('installDogfoodScenes', Sync) {
    from rootProject.file('stagewright-scenes')
    include '*.js'
    into layout.projectDirectory.dir('run-dogfood/config/stagewright/scenes')
}
// Capability descriptors travel with the scenes and split by extension, exactly as the plugin's
// provisioning does — a pack author authors both in one folder, and the bare run must not be the
// one path where half of that folder goes missing.
def installDogfoodCapabilities = tasks.register('installDogfoodCapabilities', Sync) {
    from rootProject.file('stagewright-scenes')
    include '*.json'
    into layout.projectDirectory.dir('run-dogfood/config/stagewright/capabilities')
}
tasks.named('runDogfoodServer') { dependsOn installDogfoodScenes, installDogfoodCapabilities }
