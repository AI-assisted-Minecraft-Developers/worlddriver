plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

// :api's and :common's sources, the Rhino bundle, the testmod and the sources jar: shared with :fabric.
apply from: rootProject.file('gradle/loader.gradle')

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    // The StageWright mod reaches the runs that start from the testmod source set through the StageWright
    // plugin's own remap configuration, the root's `stagewright { tests { } }` declaring this project a loader.

    // NOTE: stagewright-common is deliberately NOT bundled here. It used to be, which is what
    // put the whole test harness inside the shipped worlddriver jar and forced the driver to
    // forward server lifecycle into it. StageWright is its own mod — its neoforge module ships a
    // neoforge.mods.toml — and it depends on worlddriver, not the other way round.

    // netty-codec-http for WebSocket support. NeoForge's ModuleClassLoader will
    // NOT see plain `implementation` jars at runtime (FML only discovers mods,
    // not arbitrary classpath libraries). `forgeRuntimeLibrary` adds the jar to
    // FML's bootstrap classpath so it joins the module graph in dev runs; the
    // matching `include` nests it (Jar-in-Jar) as a library jar in the prod jar.
    // transitive=false so we ship only codec-http and reuse MC's netty core.
    // See https://docs.architectury.dev/loom/using_libraries
    include("io.netty:netty-codec-http:$rootProject.netty_version") { transitive = false }
    forgeRuntimeLibrary "io.netty:netty-codec-http:$rootProject.netty_version"
    // :common's WebSocket code is compiled here now.
    compileOnly "io.netty:netty-codec-http:$rootProject.netty_version"

}

processResources {
    // One map for both roles on purpose. A value that expands without also being a declared
    // input leaves the task up-to-date across a gradle.properties edit, so the jar keeps
    // shipping the previous metadata — how a license change once stopped at the toml.
    def expansions = [
            version                : project.version,
            minecraft_version_range: rootProject.minecraft_version_range,
            neoforge_version_range : rootProject.neoforge_version_range,
            loader_version_range   : rootProject.loader_version_range,
            mod_license            : rootProject.mod_license,
            mod_authors            : rootProject.mod_authors,
            mod_description        : rootProject.mod_description,
            mod_source_url         : rootProject.mod_source_url,
    ]
    expansions.each { key, value -> inputs.property key, value }

    filesMatching('META-INF/neoforge.mods.toml') {
        expand expansions
    }
}

shadowJar {
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

loom {
    // NeoForge uses access transformers, and architectury-loom 1.11 does NOT convert
    // access wideners for it (ForgeExtensionAPI has convertAccessWideners /
    // extraAccessWideners; NeoForgeExtensionAPI has neither — only accessTransformer).
    // So the same members are declared a second time in AT form; the two files are
    // kept in lockstep by scripts/check_remap_safety.py, not by the build.
    neoForge {
        accessTransformer file("src/main/resources/META-INF/accesstransformer.cfg")
    }

    // The testmod joins the mod FML scans, so the test classes and their service entries are part of worlddriver:
    // a bare -classpath dir would be a second module, and two modules exporting one package fail at boot.
    // architectury-loom registers the default `main` mod before this script runs, so it is configured, not created.
    // Per-run scoping holds: loom emits modFolders only for source sets on a run's classpath, so `server`
    // (no `source testmod`) never receives the test content.
    mods {
        named('main') {
            sourceSet sourceSets.testmod
        }
    }
    runs {
        server { server() }
    }
    runConfigs.configureEach {
        // The StageWright suites' runs (stagewright<Suite>…) set their own heap.
        if (it.name.startsWith('stagewright')) return
        // Cap heap so a stuck server can't trigger system OOM.
        vmArg '-Xmx2g'
    }
}
