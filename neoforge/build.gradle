plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        name = 'latvian-releases'
        url = 'https://maven.latvian.dev/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    // testkit-common (P1c dogfood wiring) — same two-line idiom as :common above,
    // and identical to how mc-testkit/neoforge/build.gradle already consumes it.
    common(project(path: ':testkit-common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':testkit-common', configuration: 'transformProductionNeoForge')

    // Rhino (KubeJS fork) — a full mod jar (ships neoforge.mods.toml), so we
    // nest it via Jar-in-Jar instead of shadowing its classes. FML discovers the
    // nested mod and DEDUPES it by version against any other mod that JiJ's the
    // same Rhino (e.g. KubeJS) — only the highest version loads, shared by all.
    // `implementation` keeps it on the dev/compile classpath (its mod metadata
    // makes FML pick it up in dev runs); `include` performs the JiJ nesting.
    implementation "dev.latvian.mods:rhino:$rootProject.rhino_version"
    include "dev.latvian.mods:rhino:$rootProject.rhino_version"

    // netty-codec-http for WebSocket support. NeoForge's ModuleClassLoader will
    // NOT see plain `implementation` jars at runtime (FML only discovers mods,
    // not arbitrary classpath libraries). `forgeRuntimeLibrary` adds the jar to
    // FML's bootstrap classpath so it joins the module graph in dev runs; the
    // matching `include` nests it (Jar-in-Jar) as a library jar in the prod jar.
    // transitive=false so we ship only codec-http and reuse MC's netty core.
    // See https://docs.architectury.dev/loom/using_libraries
    include("io.netty:netty-codec-http:$rootProject.netty_version") { transitive = false }
    forgeRuntimeLibrary "io.netty:netty-codec-http:$rootProject.netty_version"

    // snakeyaml — same FML runtime-visibility dance as netty. JiJ'd as a library
    // jar; both loaders dedupe nested jars by version, so no relocation is needed
    // (the previous shadow-relocate to net.magicterra.agent.shaded.snakeyaml is
    // dropped — JiJ avoids the class-collision it was guarding against).
    include("org.yaml:snakeyaml:$rootProject.snakeyaml_version") { transitive = false }
    forgeRuntimeLibrary "org.yaml:snakeyaml:$rootProject.snakeyaml_version"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version,
               minecraft_version_range: rootProject.minecraft_version_range,
               neoforge_version_range: rootProject.neoforge_version_range,
               loader_version_range: rootProject.loader_version_range,
               mod_license: rootProject.mod_license,
               mod_authors: rootProject.mod_authors,
               mod_description: rootProject.mod_description
    }
}

shadowJar {
    // Shadow now only merges the multi-platform `common` sources into the
    // platform jar (Architectury requires this). External libraries (Rhino,
    // netty-codec-http, snakeyaml) are nested via Jar-in-Jar (`include`) instead
    // of being shadowed/relocated, so there is no `relocate` rule here anymore.
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

loom {
    runs {
        server { server() }
        // NeoForge's userdev moddev-config.json exposes a "gameTestServer" template
        // that is byte-identical to "server" except for two system properties.
        // architectury-loom already generates the argFile; we just need to declare
        // the run and flip the two flags. After this, `gradlew :neoforge:runGameTestServer`
        // boots a dev server, auto-runs every @GameTest discovered in
        // RegisterGameTestsEvent, and exits non-zero on failure — CI-friendly.
        //
        // AgentGameTest defers runValidation() to a worker thread and polls via
        // helper.succeedWhen, so RPC/MCP round-trips no longer deadlock against
        // the server tick path (see AgentGameTest.java for the rationale).
        gameTestServer {
            server()
            property 'neoforge.enableGameTest', 'true'
            property 'neoforge.gameTestServer', 'true'
            runDir 'run-gametest'
        }
        contractServer {
            server()
            property 'agent.contractRun', 'true'
            property 'agent.rpcPort', '0'
            property 'agent.mcpPort', '0'
            runDir 'run-contract'
            vmArg '-Xmx1g'
        }
        // P1c: dogfood run — boots a professional dedicated server with BOTH
        // agent_driver and the mc-testkit harness loaded, autorun gate ON. This
        // is what proves the testkit orchestrator (t0.py) generalizes beyond its
        // own bare-bones testkit-neoforge module to a real, feature-loaded mod.
        dogfoodServer {
            server()
            property 'testkit.autorun', 'true'
            runDir 'run-dogfood'
            vmArg '-Xmx2g'
        }
        // P2c Task 4 (T1 topology, neoforge parity): a real CLIENT JVM with the
        // mc-testkit harness armed (-Dtestkit.autorun=true), mirroring fabric's
        // testkitClient. When t1.py --loader neoforge drives it into a singleplayer
        // world, the INTEGRATED server's SERVER_STARTED fires the same TestkitCommon
        // hook the dedicated dogfoodServer uses — so the 9 ad.* scenes run on an
        // integrated neoforge server = the client-topology parity this task closes
        // (T0 dedicated already ran on both loaders; P1.6 proved fabric==neoforge
        // byte-identity there). Autorun defaults ON; t1.py launches once with
        // -Pt1Autorun=false to MINT a pristine (scene-free) template world, archives
        // it, then launches normally (autorun ON) on a fresh COPY — keeping the
        // reused world byte-clean for the ad.selfShaftDigUp inverted-lottery signature.
        // Ephemeral agent ports (0 = random) so it never competes with a live dev
        // client; the orchestrator discovers the port via run-t1/agent-rpc.port.
        // DISPLAY is supplied by t1.py's environment (self-managed Xvfb), NOT here.
        // Excluded from the configureEach guard below (like contractServer) so it
        // manages its own -Xmx and agent.runValidation (neoforge's guard, unlike
        // fabric's, pins no agent ports — the exclusion is heap/validation only).
        testkitClient {
            client()
            property 'testkit.autorun', project.findProperty('t1Autorun') ?: 'true'
            property 'agent.rpcPort', '0'
            property 'agent.mcpPort', '0'
            runDir 'run-t1'
            vmArg '-Xmx2g'
        }
    }
    runConfigs.configureEach {
        // contractServer and testkitClient manage their own -Xmx (contractServer 1g;
        // testkitClient a client run with its own 2g cap), so exclude them from the
        // guard's default heap/runValidation pinning below.
        if (it.name == 'contractServer' || it.name == 'testkitClient') return
        property 'agent.runValidation', project.findProperty('agentRunValidation') ?: 'false'
        // Cap heap so dedicated server + gametest don't trigger system OOM.
        vmArg '-Xmx2g'
    }
}
