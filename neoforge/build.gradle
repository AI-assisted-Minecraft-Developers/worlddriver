plugins {
    id 'com.gradleup.shadow'
    // :api's and :common's sources, the Rhino bundle, the testmod and the sources jar: shared with :fabric.
    id 'worlddriver.loader'
}

neoForge {
    enable {
        version = rootProject.neoforge_version
        // For the reason given in common/build.gradle.
        disableRecompilation = true
    }
    // :common's access transformer, which the jar carries at the default place NeoForge reads it from.
    accessTransformers = [project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')]

    mods {
        // The testmod is in no mod of this build's own: StageWright's plugin gives the suites' runs a copy of this
        // mod with the testmod in it, and every other run loads this one.
        worlddriver {
            sourceSet sourceSets.main
        }
    }
    runs {
        // Unlike Fabric's, these take ephemeral ports (docs/guide/getting-started.md, Ports).
        client {
            client()
        }
        server {
            server()
        }
        configureEach {
            // The StageWright suites' runs (stagewright<Suite>…) set their own heap.
            if (name.startsWith('stagewright')) return
            // Cap heap so a stuck client/server can't trigger system OOM.
            jvmArgument '-Xmx2g'
        }
    }
}

dependencies {
    // The StageWright mod reaches the runs that start from the testmod source set through the StageWright
    // plugin's own runtime configuration, the root's `stagewright { tests { } }` declaring this project a loader.

    // NOTE: stagewright-common is deliberately NOT bundled here. It used to be, which is what
    // put the whole test harness inside the shipped worlddriver jar and forced the driver to
    // forward server lifecycle into it. StageWright is its own mod — its neoforge module ships a
    // neoforge.mods.toml — and it depends on worlddriver, not the other way round.

    // netty-codec-http for WebSocket support. FML loads game code from mods only, so a plain dependency is
    // invisible to it in a dev run; additionalRuntimeClasspath puts the jar on the game's classpath. jarJar nests
    // it in the shipped jar. transitive=false so we ship only codec-http and reuse MC's netty core.
    compileOnly "io.netty:netty-codec-http:$rootProject.netty_version"
    additionalRuntimeClasspath("io.netty:netty-codec-http:$rootProject.netty_version") { transitive = false }
    jarJar("io.netty:netty-codec-http:$rootProject.netty_version") { transitive = false }
}

processResources {
    // One map for both roles on purpose. A value that expands without also being a declared
    // input leaves the task up-to-date across a gradle.properties edit, so the jar keeps
    // shipping the previous metadata — how a license change once stopped at the toml.
    def expansions = [
            version                : project.version,
            minecraft_version_range: rootProject.minecraft_version_range,
            neoforge_version_range : rootProject.neoforge_version_range,
            loader_version_range   : rootProject.loader_version_range,
            mod_license            : rootProject.mod_license,
            mod_authors            : rootProject.mod_authors,
            mod_description        : rootProject.mod_description,
            mod_source_url         : rootProject.mod_source_url,
    ]
    expansions.each { key, value -> inputs.property key, value }

    filesMatching('META-INF/neoforge.mods.toml') {
        expand expansions
    }
}

// The shipped jar is shadowJar's: ModDevGradle nests the jarJar output into `jar` only, so it is added here too.
tasks.named('jar', Jar) { archiveClassifier = 'slim' }
shadowJar {
    archiveClassifier = ''
    from(tasks.named('jarJar'))
}

// Published as the same jar under both names: NeoForge runs in Mojang names, so nothing is remapped.
ext.shippedJar = tasks.named('shadowJar')
ext.devJar = tasks.named('shadowJar')
tasks.named('assemble') { dependsOn 'shadowJar' }
