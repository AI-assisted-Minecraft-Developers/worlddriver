import groovy.json.JsonOutput

plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
    rhinoSource {
        canBeResolved = true
        canBeConsumed = false
        transitive = false
    }
}

// Rhino's classes only: its fabric.mod.json / mods.toml must not reach the shipped jar.
tasks.register('rhinoClasses', Jar) {
    archiveBaseName = 'rhino-classes'
    destinationDirectory = layout.buildDirectory.dir('rhino')
    from({ configurations.rhinoSource.collect { zipTree(it) } }) {
        include 'dev/latvian/mods/rhino/**'
    }
}

repositories {
    maven {
        name = 'latvian-releases'
        url = 'https://maven.latvian.dev/releases'
        // Fenced for the reason given in common/build.gradle.
        content { includeGroup 'dev.latvian.mods' }
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
    // Required mod (fabric.mod.json `depends`), not nested: the player installs it alongside.
    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    common(project(path: ':api', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':api', configuration: 'transformProductionFabric')
    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    // The StageWright mod reaches the runs that start from the testmod source set through the StageWright
    // plugin's own remap configuration, the root's `stagewright { tests { } }` declaring this project a loader.

    // NOTE: stagewright-common is deliberately NOT bundled here. It used to be, which is what
    // put the whole test harness inside the shipped worlddriver jar and forced the driver to
    // forward server lifecycle into it. StageWright is its own mod — its fabric module ships a
    // fabric.mod.json — and it depends on worlddriver, not the other way round.

    // Rhino (KubeJS fork): `implementation` is the dev/compile classpath; the shipped jar gets a
    // relocated, metadata-free copy of its classes (rhinoClasses, below), never a nested mod.
    implementation "dev.latvian.mods:rhino:$rootProject.rhino_version"
    rhinoSource "dev.latvian.mods:rhino:$rootProject.rhino_version"
    shadowBundle files(rhinoClasses)

    // netty-codec-http for WebSocket support. Fabric loader doesn't isolate
    // libraries the way NeoForge does, so plain `implementation` is enough at
    // runtime; `include` nests it (Jar-in-Jar) inside the prod jar.
    // transitive=false so we ship only codec-http and reuse MC's netty core.
    include("io.netty:netty-codec-http:$rootProject.netty_version") { transitive = false }
    implementation "io.netty:netty-codec-http:$rootProject.netty_version"

}

// testmod source set — EMPTY-SOURCE BRIDGE: it has no sources of its own and carries :common's testmod
// output onto the runs whose `source` it is (labClient below, and the StageWright suites' runs); the other
// runs keep `main` and never see the test content. Fabric has no module layer, so unlike NeoForge the
// output can go straight onto the runtime classpath. evaluationDependsOn(':common') makes :common's
// sourceSets.testmod resolvable here.
evaluationDependsOn(':common')
sourceSets {
    testmod {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output + project(':common').sourceSets.testmod.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output + project(':common').sourceSets.testmod.output
    }
}

// Fabric writes a range as space-joined predicates, not a Maven interval: `[1.21.1,1.22)` is
// `>=1.21.1 <1.22`. A single interval only; anything else fails the build rather than widening.
def fabricRange = { String maven ->
    def m = maven.trim() =~ /^([\[(])([^,\])]*)(?:,([^\])]*))?([\])])$/
    if (!m.matches()) throw new GradleException("not a single Maven interval: ${maven}")
    String lowBracket = m.group(1), low = m.group(2), high = m.group(3), highBracket = m.group(4)
    if (high == null) return low
    def parts = []
    if (low) parts << (lowBracket == '[' ? '>=' : '>') + low
    if (high) parts << (highBracket == ']' ? '<=' : '<') + high
    return parts.join(' ')
}
// The inside of a JSON string literal, so the template stays valid JSON for loom to read.
def jsonText = { String s -> JsonOutput.toJson(s)[1..-2] }

processResources {
    // The same values neoforge.mods.toml expands, and one map for expand and inputs, for the reason
    // given there.
    def expansions = [
            version            : project.version,
            mod_license        : jsonText(rootProject.mod_license),
            mod_description    : jsonText(rootProject.mod_description),
            mod_source_url     : jsonText(rootProject.mod_source_url),
            // Joined with `", "` so the template's ["${mod_authors}"] becomes one string per author.
            mod_authors        : rootProject.mod_authors.split(',').collect { jsonText(it.trim()) }.join('", "'),
            minecraft_range    : fabricRange(rootProject.minecraft_version_range),
            architectury_range : fabricRange(rootProject.architectury_version_range),
            fabric_loader_range: ">=${rootProject.fabric_loader_version}".toString(),
    ]
    expansions.each { key, value -> inputs.property key, value }

    filesMatching('fabric.mod.json') {
        expand expansions
    }
}

shadowJar {
    // Rhino is shaded and relocated so KubeJS's copy cannot change WorldDriver's scripts;
    // netty-codec-http stays nested (Jar-in-Jar).
    relocate 'dev.latvian.mods.rhino', 'net.magicterra.worlddriver.shadow.rhino'
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

// The binary bundles :api and :common, so their sources ship here too, or this jar would not be the source
// of the one published beside it. The manifest and licence texts are this jar's own.
sourcesJar {
    [':api', ':common'].each { path ->
        def bundled = project(path).tasks.named('sourcesJar', Jar)
        dependsOn bundled
        from(bundled.flatMap { it.archiveFile }.map { zipTree(it) }) {
            exclude 'META-INF/MANIFEST.MF', 'META-INF/COPYING', 'META-INF/COPYING.LESSER'
        }
    }
}

loom {
    // Share :common's access widener rather than declaring a second one, so the two
    // loaders can never widen different sets of members. Loom remaps the file into the
    // artifact's namespace during remapJar; fabric.mod.json's "accessWidener" key is
    // what makes Fabric Loader apply it at runtime in production.
    accessWidenerPath = project(":common").loom.accessWidenerPath

    // Groups :common's testmod output under the worlddriver mod (classPathGroups, mixin/refmap
    // ownership). It only groups entries already on a run's classpath, so runs from `main` still
    // carry no test content.
    //
    // FABRIC-vs-NEOFORGE DIFFERENCE (found empirically, documented per the brief):
    // neoforge/build.gradle can write `mods { named('main') { … } }` because architectury's
    // neoForge() setup EAGERLY registers the default "main" mod during plugin apply. fabric()
    // does NOT — loom only creates "main" lazily in an afterEvaluate fallback (Loom
    // CompileConfiguration: `if (getMods().isEmpty()) create("main").sourceSet(main)`), which
    // runs AFTER this script body, so `named('main')` here throws "ModSettings with name 'main'
    // not found". We therefore replicate loom's own default explicitly — maybeCreate('main')
    // + attach the main source set — then add :common's testmod. Creating the entry ourselves
    // also makes the container non-empty, so loom's isEmpty() fallback is a no-op (no double
    // registration).
    mods {
        def mainMod = maybeCreate('main')
        mainMod.sourceSet sourceSets.main
        // :common's MAIN, so the access widener declared in fabric.mod.json is inside
        // the worlddriver mod container during DEV runs. The production jar was never
        // the problem — shadowJar merges :common's resources, and the remapped jar does
        // carry the widener. Dev is different: FabricLoaderImpl.loadAccessWideners()
        // resolves the name against the MOD's own roots, not the run classpath, and
        // those roots come from this block. Without this line the server dies at boot
        // with "Missing accessWidener file worlddriver.accesswidener from mod
        // worlddriver".
        mainMod.sourceSet project(':api').sourceSets.main, project(':api')
        mainMod.sourceSet project(':common').sourceSets.main, project(':common')
        mainMod.sourceSet project(':common').sourceSets.testmod, project(':common')
    }
    runs {
        server { server() }
        // Explicit client config so we can inject -Dfabric.addMods=run/mods,
        // which makes Fabric Loader pick up Modrinth-distributed jars under
        // fabric/run/mods/ in dev. Without this, the loader only sees mods
        // declared via modImplementation/modRuntimeOnly.
        client {
            client()
            vmArg '-Dfabric.addMods=run/mods'
        }
        // The lab: a client with the test content on a persistent flat world, for testing by hand.
        // Nothing wipes `run-lab`. See docs/guide/human-verification.md.
        labClient {
            client()
            property 'stagewright.client.world', 'Lab'
            property 'stagewright.client.exitWhenDone', 'false'
            property 'worlddriver.rpcPort', '39801'
            property 'worlddriver.mcpPort', '39800'
            // Unfocused on a desktop; vanilla would pause it. See docs/guide/human-verification.md.
            property 'worlddriver.pauseOnLostFocus', 'false'
            runDir 'run-lab'
            vmArg '-Xmx2g'
            source sourceSets.testmod
        }
    }
    runConfigs.configureEach {
        // The StageWright suites' runs (stagewright<Suite>…) pin their own ephemeral ports and heap;
        // the defaults below are for the dev runs and would make them fight a live dev client.
        if (it.name.startsWith('stagewright')) return
        // The validation startup hook ships with the testmod, so only a run carrying it can honour the flag.
        if (it.getSource(project) == sourceSets.testmod) {
            property 'worlddriver.runValidation', project.findProperty('agentRunValidation') ?: 'false'
        }
        // Pin the MCP / RPC ports so the external driver (Claude harness, docs
        // example, rpc.py) always finds the mod at a known address. Default to
        // 39800/39801; WorldDriverCommon reads -Dworlddriver.mcpPort / -Dworlddriver.rpcPort
        // (0 = random). Override with -PagentMcpPort=… / -PagentRpcPort=… if two
        // clients must coexist.
        property 'worlddriver.mcpPort', project.findProperty('agentMcpPort') ?: '39800'
        property 'worlddriver.rpcPort', project.findProperty('agentRpcPort') ?: '39801'
        // Persist mc.bot.setting changes to config/worlddriver_bot.properties so
        // survival toggles (autoSwim, autoRetreat, …) survive a client restart and
        // don't have to be re-applied every relaunch. Opt-in (set only on the dev
        // runs, NOT the StageWright suites' runs) so the tests stay deterministic on
        // pure defaults. Override with -PagentPersistConfig=false.
        property 'worlddriver.persistConfig', project.findProperty('agentPersistConfig') ?: 'true'
        // Cap heap so a stuck client/server can't trigger system OOM. MC 1.21.1 fits comfortably.
        vmArg '-Xmx2g'
    }
}
