import groovy.json.JsonOutput

plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

// :api's and :common's sources, the Rhino bundle, the testmod and the sources jar: shared with :neoforge.
apply from: rootProject.file('gradle/loader.gradle')

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // The StageWright mod reaches the runs that start from the testmod source set through the StageWright
    // plugin's own remap configuration, the root's `stagewright { tests { } }` declaring this project a loader.

    // NOTE: stagewright-common is deliberately NOT bundled here. It used to be, which is what
    // put the whole test harness inside the shipped worlddriver jar and forced the driver to
    // forward server lifecycle into it. StageWright is its own mod — its fabric module ships a
    // fabric.mod.json — and it depends on worlddriver, not the other way round.

    // netty-codec-http for WebSocket support. Fabric loader doesn't isolate
    // libraries the way NeoForge does, so plain `implementation` is enough at
    // runtime; `include` nests it (Jar-in-Jar) inside the prod jar.
    // transitive=false so we ship only codec-http and reuse MC's netty core.
    include("io.netty:netty-codec-http:$rootProject.netty_version") { transitive = false }
    implementation "io.netty:netty-codec-http:$rootProject.netty_version"

}

// Fabric writes a range as space-joined predicates, not a Maven interval: `[1.21.1,1.22)` is
// `>=1.21.1 <1.22`. A single interval only; anything else fails the build rather than widening.
def fabricRange = { String maven ->
    def m = maven.trim() =~ /^([\[(])([^,\])]*)(?:,([^\])]*))?([\])])$/
    if (!m.matches()) throw new GradleException("not a single Maven interval: ${maven}")
    String lowBracket = m.group(1), low = m.group(2), high = m.group(3), highBracket = m.group(4)
    if (high == null) return low
    def parts = []
    if (low) parts << (lowBracket == '[' ? '>=' : '>') + low
    if (high) parts << (highBracket == ']' ? '<=' : '<') + high
    return parts.join(' ')
}
// The inside of a JSON string literal, so the template stays valid JSON for loom to read.
def jsonText = { String s -> JsonOutput.toJson(s)[1..-2] }

processResources {
    // The same values neoforge.mods.toml expands, and one map for expand and inputs, for the reason
    // given there.
    def expansions = [
            version            : project.version,
            mod_license        : jsonText(rootProject.mod_license),
            mod_description    : jsonText(rootProject.mod_description),
            mod_source_url     : jsonText(rootProject.mod_source_url),
            // Joined with `", "` so the template's ["${mod_authors}"] becomes one string per author.
            mod_authors        : rootProject.mod_authors.split(',').collect { jsonText(it.trim()) }.join('", "'),
            minecraft_range    : fabricRange(rootProject.minecraft_version_range),
            fabric_loader_range: ">=${rootProject.fabric_loader_version}".toString(),
    ]
    expansions.each { key, value -> inputs.property key, value }

    filesMatching('fabric.mod.json') {
        expand expansions
    }
}

shadowJar {
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

loom {
    // Share :common's access widener rather than declaring a second one, so the two
    // loaders can never widen different sets of members. Loom remaps the file into the
    // artifact's namespace during remapJar; fabric.mod.json's "accessWidener" key is
    // what makes Fabric Loader apply it at runtime in production.
    accessWidenerPath = project(":common").loom.accessWidenerPath

    // Fabric Loom creates its default `main` mod only when the build declares none, after this script, so the
    // entry is made here. The testmod joins it; it only groups entries already on a run's classpath, so runs
    // from `main` still carry no test content.
    mods {
        def mainMod = maybeCreate('main')
        mainMod.sourceSet sourceSets.main
        mainMod.sourceSet sourceSets.testmod
    }
    runs {
        server { server() }
        // Explicit client config so we can inject -Dfabric.addMods=run/mods,
        // which makes Fabric Loader pick up Modrinth-distributed jars under
        // fabric/run/mods/ in dev. Without this, the loader only sees mods
        // declared via modImplementation/modRuntimeOnly.
        client {
            client()
            vmArg '-Dfabric.addMods=run/mods'
        }
        // The lab: a client with the test content on a persistent flat world, for testing by hand.
        // Nothing wipes `run-lab`. See docs/dev/running-the-client.md.
        labClient {
            client()
            property 'stagewright.client.world', 'Lab'
            property 'stagewright.client.exitWhenDone', 'false'
            property 'worlddriver.rpcPort', '39801'
            property 'worlddriver.mcpPort', '39800'
            // Unfocused on a desktop; vanilla would pause it. See docs/dev/running-the-client.md.
            property 'worlddriver.pauseOnLostFocus', 'false'
            runDir 'run-lab'
            vmArg '-Xmx2g'
            source sourceSets.testmod
        }
    }
    runConfigs.configureEach {
        // The StageWright suites' runs (stagewright<Suite>…) pin their own ephemeral ports and heap;
        // the defaults below are for the dev runs and would make them fight a live dev client.
        if (it.name.startsWith('stagewright')) return
        // Pin the MCP / RPC ports so the external driver (Claude harness, docs
        // example, rpc.py) always finds the mod at a known address. Default to
        // 39800/39801; WorldDriverCommon reads -Dworlddriver.mcpPort / -Dworlddriver.rpcPort
        // (0 = random). Override with -PagentMcpPort=… / -PagentRpcPort=… if two
        // clients must coexist.
        property 'worlddriver.mcpPort', project.findProperty('agentMcpPort') ?: '39800'
        property 'worlddriver.rpcPort', project.findProperty('agentRpcPort') ?: '39801'
        // Persist mc.bot.setting changes to config/worlddriver_bot.properties so
        // survival toggles (autoSwim, autoRetreat, …) survive a client restart and
        // don't have to be re-applied every relaunch. Opt-in (set only on the dev
        // runs, NOT the StageWright suites' runs) so the tests stay deterministic on
        // pure defaults. Override with -PagentPersistConfig=false.
        property 'worlddriver.persistConfig', project.findProperty('agentPersistConfig') ?: 'true'
        // Cap heap so a stuck client/server can't trigger system OOM. MC 1.21.1 fits comfortably.
        vmArg '-Xmx2g'
    }
}
