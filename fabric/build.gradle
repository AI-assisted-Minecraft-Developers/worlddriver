plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'latvian-releases'
        url = 'https://maven.latvian.dev/releases'
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    // DEV-ONLY: put the StageWright mod on the dev run classpath so every headless run
    // boots with both mods, the way a production install would
    // (worlddriver.jar + stagewright.jar side by side). `modLocalRuntime` is never published
    // and never bundled — it is the build-graph equivalent of `testImplementation junit`.
    // A `mod*` configuration, so loom DOES remap this one: the published jar is
    // intermediary and the dev runtime needs named. That is the opposite of the `:dev`
    // classifier :common's testmod compile uses, and both are right for their side.
    // `changing = true` — see the note beside the neoforge twin. mavenLocal keeps the version while
    // the contents move, and loom's remap cache is keyed on coordinates, so without this a
    // republished harness is invisible to the dev run.
    modLocalRuntime("net.magicterra:mc_stagewright-fabric:${rootProject.stagewright_version}") {
        changing = true
    }

    // NOTE: stagewright-common is deliberately NOT bundled here. It used to be, which is what
    // put the whole test harness inside the shipped worlddriver jar and forced the driver to
    // forward server lifecycle into it. StageWright is its own mod — its fabric module ships a
    // fabric.mod.json — and it depends on worlddriver, not the other way round.

    // Rhino (KubeJS fork) — a full mod jar (ships fabric.mod.json), so we nest it
    // via Jar-in-Jar instead of shadowing its classes. Fabric Loader discovers
    // the nested mod and dedupes it by version against any other mod that
    // includes the same Rhino (e.g. KubeJS) — only the highest version loads.
    // `implementation` keeps it on the dev/compile classpath; `include` nests it.
    implementation "dev.latvian.mods:rhino:$rootProject.rhino_version"
    include "dev.latvian.mods:rhino:$rootProject.rhino_version"

    // netty-codec-http for WebSocket support. Fabric loader doesn't isolate
    // libraries the way NeoForge does, so plain `implementation` is enough at
    // runtime; `include` nests it (Jar-in-Jar) inside the prod jar.
    // transitive=false so we ship only codec-http and reuse MC's netty core.
    include("io.netty:netty-codec-http:$rootProject.netty_version") { transitive = false }
    implementation "io.netty:netty-codec-http:$rootProject.netty_version"

}

// testmod source set — EMPTY-SOURCE BRIDGE, the fabric counterpart of neoforge's testmod
// wiring. Fabric never carried test java of its own, and post-campaign (P4b/P4c migrated
// every legacy @GameTest arena to a dogfooded wd.* scene, P4-final retired the GameTestServer
// machinery) all scenes + SimProbes + the SceneProvider service live in :common's testmod.
// This source set is therefore empty of sources — it exists purely as the run `source`
// carrier so the headless runs keep main's full runtimeClasspath AND
// gain :common's testmod OUTPUT+resources.
//
// Fabric-vs-neoforge difference (documented honestly per the brief): fabric has NO JPMS
// module layer — every mod + loose classpath entry shares Knot's single flat classloader.
// So, unlike neoforge (where putting :common's testmod on runtimeClasspath makes FML's
// userdev locator synthesize a SECOND module exporting the same package = a hard
// ResolutionException at boot, forcing that platform to deliver it ONLY through the loom
// mods{} modFolders group), fabric can safely put :common's testmod OUTPUT directly on
// THIS source set's runtimeClasspath. That is what actually scopes scene discovery per
// run: only runs whose `source` is this testmod set carry the scenes; contractServer /
// server / client keep the default `main` source set and never see them (the instrument
// contract's scene-independence — asserted by the 23/23 gate). evaluationDependsOn(':common')
// forces :common to configure first so its sourceSets.testmod is resolvable here.
evaluationDependsOn(':common')
sourceSets {
    testmod {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output + project(':common').sourceSets.testmod.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output + project(':common').sourceSets.testmod.output
    }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

shadowJar {
    // Shadow now only merges the multi-platform `common` sources into the
    // platform jar (Architectury requires this). External libraries (Rhino,
    // netty-codec-http) are nested via Jar-in-Jar (`include`) instead
    // of being shadowed/relocated, so there is no `relocate` rule here anymore.
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

loom {
    // Share :common's access widener rather than declaring a second one, so the two
    // loaders can never widen different sets of members. Loom remaps the file into the
    // artifact's namespace during remapJar; fabric.mod.json's "accessWidener" key is
    // what makes Fabric Loader apply it at runtime in production.
    accessWidenerPath = project(":common").loom.accessWidenerPath

    // P4a Task 3: mark :common's testmod OUTPUT as belonging to the worlddriver mod so
    // the moved scene/probe classes are grouped under worlddriver for fabric's
    // classPathGroups (mixin/refmap ownership) and ServiceLoader(SceneProvider), run in
    // the mod's context, treats them as first-party. On fabric the runtimeClasspath
    // addition above is what actually puts the classes on each run's launch classpath;
    // this block only groups entries already there, so it does NOT leak scenes into
    // contractServer (whose `main` source set never carries :common's testmod).
    //
    // FABRIC-vs-NEOFORGE DIFFERENCE (found empirically, documented per the brief):
    // neoforge/build.gradle can write `mods { named('main') { … } }` because architectury's
    // neoForge() setup EAGERLY registers the default "main" mod during plugin apply. fabric()
    // does NOT — loom only creates "main" lazily in an afterEvaluate fallback (Loom
    // CompileConfiguration: `if (getMods().isEmpty()) create("main").sourceSet(main)`), which
    // runs AFTER this script body, so `named('main')` here throws "ModSettings with name 'main'
    // not found". We therefore replicate loom's own default explicitly — maybeCreate('main')
    // + attach the main source set — then add :common's testmod. Creating the entry ourselves
    // also makes the container non-empty, so loom's isEmpty() fallback is a no-op (no double
    // registration).
    mods {
        def mainMod = maybeCreate('main')
        mainMod.sourceSet sourceSets.main
        // :common's MAIN, so the access widener declared in fabric.mod.json is inside
        // the worlddriver mod container during DEV runs. The production jar was never
        // the problem — shadowJar merges :common's resources, and the remapped jar does
        // carry the widener. Dev is different: FabricLoaderImpl.loadAccessWideners()
        // resolves the name against the MOD's own roots, not the run classpath, and
        // those roots come from this block. Without this line the server dies at boot
        // with "Missing accessWidener file worlddriver.accesswidener from mod
        // worlddriver" and t0 sits on a dead JVM until the 900s wall timeout.
        mainMod.sourceSet project(':common').sourceSets.main, project(':common')
        mainMod.sourceSet project(':common').sourceSets.testmod, project(':common')
    }
    runs {
        server { server() }
        // Explicit client config so we can inject -Dfabric.addMods=run/mods,
        // which makes Fabric Loader pick up Modrinth-distributed jars under
        // fabric/run/mods/ in dev. Without this, the loader only sees mods
        // declared via modImplementation/modRuntimeOnly.
        client {
            client()
            vmArg '-Dfabric.addMods=run/mods'
        }
        contractServer {
            server()
            property 'worlddriver.contractRun', 'true'
            property 'worlddriver.rpcPort', '0'
            property 'worlddriver.mcpPort', '0'
            runDir 'run-contract'
            vmArg '-Xmx1g'
        }
        // P1.6 Task 3: dogfood run — a plain dedicated server with BOTH worlddriver
        // and the stagewright harness loaded, autorun gate ON, mirroring
        // neoforge/build.gradle's dogfoodServer. Proves the harness generalizes to the
        // feature-loaded fabric loader. Ephemeral agent
        // ports (0 = random) so it never competes with a live dev client on 39800/39801
        // — and it is excluded from the configureEach port-pinning guard below (P1b lesson).
        dogfoodServer {
            server()
            property 'stagewright.autorun', 'true'
            // THE BODY THE GATES TEST. Without this the 241 wd.* scenes run on a body that never
            // went through PlayerList.placeNewPlayer, and `wd.bodyParityCensus` measured what that
            // costs: on NeoForge the factory body is a real net.neoforged FakePlayer, and
            // PlayerAdvancements.award has an `instanceof FakePlayer` branch, so it earns NOTHING
            // (award() false, vs true for a joined body) — which is the entire root cause of the
            // NeoForge-only red `wd.serverAvatarEarnsAdvancement`. FakePlayer.awardStat is likewise
            // an unconditional empty override, and statistics are the INPUT to progress triggers
            // (JUMP / FALL_ONE_CM / DAMAGE_DEALT / ENTITY_KILLED), so the same body silently fails
            // anything built on them: same walk, same 11 ticks, walk_one_cm 0 vs 227.
            property 'worlddriver.realPlayerBodies', 'true'
            property 'worlddriver.rpcPort', '0'
            property 'worlddriver.mcpPort', '0'
            runDir 'run-dogfood'
            vmArg '-Xmx2g'
            // P4a Task 3: the wd.* dogfood scenes + SceneProvider service moved to :common's
            // testmod (routed onto this fabric testmod source set's runtimeClasspath above).
            // `source sourceSets.testmod` puts that output+resources on this run so
            // ServiceLoader discovers WorldDriverScenes and the 9 scenes run. (contractServer
            // is deliberately NOT given this — the instrument contract is scene-independent.)
            source sourceSets.testmod
        }
        // ---- Self-driving topologies. No orchestrator process. ----
        //
        // These replaced the orchestrator-driven pair (stagewrightClient in run-t1, t2Server in
        // run-t2), deleted along with the scripts that drove them from outside. No orchestrator
        // process remains: the last two went on 2026-08-05.
        //
        // Everything the orchestrators used to supply — enter a world, dial a server, wait for a
        // player, exit when finished — is a system property the harness reads for itself.

        // Integrated-server topology: a client that opens its own singleplayer world, whose
        // integrated server arms the same harness the dedicated one does.
        stagewrightIntegratedServer {
            client()
            property 'stagewright.autorun', 'true'
            // ⚠️ THIS TOPOLOGY NO LONGER VARIES ONLY THE RUN, and that is now on purpose. The
            // 2026-08-20 body-selection instruction puts JoinedBody on the DEDICATED server only, so
            // `SceneBody` refuses to mint one here and every scene that needs a headless body is a
            // recorded skip until its family is converted to the client helm. The flag stays because
            // it still decides what the ladder's topologies get, and because turning it off would
            // put the retired FakePlayer back — a worse body, not a smaller change.
            // The old doctrine「a topology must vary the RUN, never the subject」still applies to
            // every OTHER pair of topologies, and it is why the skips have to be reconciled against
            // the dedicated gate rather than counted as coverage.
            property 'worlddriver.realPlayerBodies', 'true'
            // Hold the suite until the local player is actually placed. Without it the suite arms at
            // SERVER_STARTED — before that happens — and `SceneBody`'s refusal would be answering a
            // question whose answer changes part-way through the run: scenes that got in early would
            // mint a body, later ones would skip, and the split would be decided by boot speed.
            // `journeyIntegratedServer` has always set this for the same reason.
            property 'stagewright.awaitPlayer', 'true'
            property 'stagewright.client.world', 'StageWrightClient'
            property 'stagewright.client.exitWhenDone', 'true'
            property 'worlddriver.rpcPort', '0'
            property 'worlddriver.mcpPort', '0'
            runDir 'run-stagewright-integrated'
            vmArg '-Xmx2g'
            source sourceSets.testmod
        }
        // Production topology, server half: holds the suite back until a real client has joined.
        stagewrightDedicatedServerWithClient {
            server()
            programArgs '--nogui', '--port', '25601'
            property 'stagewright.autorun', 'true'
            // Same body everywhere — see dogfoodServer.
            property 'worlddriver.realPlayerBodies', 'true'
            property 'stagewright.awaitPlayer', 'true'
            property 'worlddriver.rpcPort', '0'
            property 'worlddriver.mcpPort', '0'
            runDir 'run-stagewright-with-client'
            vmArg '-Xmx2g'
            source sourceSets.testmod
        }
        // Production topology, client half. Started by the plugin as a companion of the server
        // above, so it needs no scenes of its own — it only has to be a real player.
        stagewrightJoiningClient {
            client()
            property 'stagewright.client.connect', '127.0.0.1:25601'
            property 'worlddriver.rpcPort', '0'
            property 'worlddriver.mcpPort', '0'
            runDir 'run-stagewright-joining-client'
            vmArg '-Xmx2g'
        }
        // The playthrough ladder (wd.journey*). Deliberately NOT one of the six gates: a
        // playthrough is hours where they are minutes, so it arms behind its own property and
        // filters to its own family. The filter is what keeps the manifests out of it —
        // SceneFilter skips expected-scenes reconciliation on a filtered run, which is correct
        // here (this run is not a gate) and is why `wd.journey*` needs no manifest entry. Only
        // `wd.journeyArmed`, which registers in every run, is listed there.
        //
        // Its own runDir: the journey PLAYS the world — it fells trees, digs shafts and pours
        // lava — and the six gates assume a world whose only history is their own arenas.
        journeyServer {
            server()
            property 'stagewright.autorun', 'true'
            property 'worlddriver.journey', 'true'
            // A body that never went through PlayerList.placeNewPlayer is not in level.players(),
            // and vanilla asks that list before it does any of the endgame work: EndDragonFight.tick
            // creates NO dragon while it is empty, BaseSpawner.isNearPlayer never turns a fortress
            // spawner, and nothing spawns naturally. All three fail silently — the End even builds
            // its crystals, so only the dragon looks missing. One flag, three rungs.
            property 'worlddriver.realPlayerBodies', 'true'
            property 'stagewright.scenes', 'wd.journey*'
            property 'worlddriver.rpcPort', '0'
            property 'worlddriver.mcpPort', '0'
            runDir 'run-journey'
            vmArg '-Xmx2g'
            source sourceSets.testmod
        }
        // ---- The SAME ladder, under the other two topologies. ----
        //
        // The three exist so that a failed rung can be read as「这具身体做不到」or「这台驱动做不
        // 对」rather than as one undivided fact. `journeyServer` above is the only one of them that
        // has ever run, and it is the one with NO client at all: nothing renders, nothing sends a
        // movement packet, and every client-side class in this repo is absent from the JVM. A defect
        // that lives on that side cannot be observed there at ALL — which is how
        // `ServerPlayerAvatar.commandUseItem(false)` shipped calling `stopUsingItem()` (clears the
        // flag) instead of `releaseUsingItem()` (routes to `ItemStack.releaseUsing`): a fully drawn
        // bow「fired」and produced no arrow, with no exception, past 222 green scenes.
        //
        // What each one adds, precisely:
        //
        //   journeyServer                    — headless. Nothing but the server exists.
        //   journeyIntegratedServer          — a real client hosts the world. Both ends in ONE JVM,
        //                                      so the client half of the driver is loaded and
        //                                      ticking, chunks are streamed to a real view, and a
        //                                      real ServerPlayer sits in the overworld's player list.
        //   journeyDedicatedServerWithClient — a real client JOINS over a socket. Same as above but
        //                                      the two halves are separate processes and every
        //                                      packet is actually encoded, which is the difference
        //                                      between「works in singleplayer」and「works on a
        //                                      server」.
        //
        // ⚠️ WHICH BODY CLIMBS IS NOT THE SAME ON ALL THREE, and this comment said the opposite
        // until 2026-08-22. `journeyIntegratedServer` ADOPTS the client's real player
        // (`JourneyRig.spawnBody` takes the adoption branch, `realPlayerHelm` flips the helm to
        // `BotApi.runProcess`); the other two mint the headless body via
        // `ServerWorldDriver.createIsolated`. That is not a code reading — a run of it recorded
        // `journey.body=real:ServerPlayer Player452` and `journey.steer=clientUserTask/
        // ClientPlayerAvatar` against the headless arm's `joined` / `serverTick`, which is how the
        // deep-water jump gate got found. So the fake-player capability gaps (fallDistance always
        // 0, isInvulnerableTo → true, no advancements) belong to the OTHER TWO, not to all three.
        // Every rung records `journey.topology`, `journey.body` AND `journey.steer`, because this
        // topology varies two things at once and a row missing either cannot be compared.
        //
        // ⚠️ AND `worlddriver.realPlayerBodies` STAYS ON for both of these, which looks redundant and
        // is not. `ServerLevel.players()` is PER LEVEL, and the human client never leaves the
        // overworld: rungs 14–15 ask the NETHER's list (BaseSpawner.isNearPlayer, for a fortress
        // spawner) and 19–20 ask the END's (EndDragonFight.tick). A client standing at world spawn
        // contributes nothing to either. Turning the flag off here would make those rungs fail
        // silently — no dragon, no blazes — in a run that looks better resourced than the headless one.
        //
        // Each has its OWN runDir, and that is not tidiness: the ladder PLAYS its world, so two
        // ladders sharing a directory would each measure the other's felled trees and dug shafts.
        journeyIntegratedServer {
            client()
            property 'stagewright.autorun', 'true'
            // Hold the suite until the client is actually IN the world it is hosting. Without this
            // the integrated server arms at SERVER_STARTED, which on this topology is before the
            // local player has been placed — so rung 1 would race the very thing this topology
            // exists to provide, and「有没有真玩家」would depend on boot timing.
            property 'stagewright.awaitPlayer', 'true'
            // Empty unless asked for; the default lives in JourneyRig. -PwalkerDebug=true turns on
            // the per-tick walker/AutoSwim account, which is the only record of what the client
            // helm does to a submerged body.
            property 'worlddriver.journey.walkerDebug', (project.findProperty('walkerDebug') ?: '')
            property 'stagewright.client.world', 'JourneyClient'
            property 'stagewright.client.exitWhenDone', 'true'
            property 'worlddriver.journey', 'true'
            property 'worlddriver.realPlayerBodies', 'true'
            property 'stagewright.scenes', 'wd.journey*'
            property 'worlddriver.rpcPort', '0'
            property 'worlddriver.mcpPort', '0'
            runDir 'run-journey-integrated'
            vmArg '-Xmx2g'
            source sourceSets.testmod
        }
        // Production topology, server half. Its own port, NOT the gate's 25601: the gate's companion
        // dials that number, and a ladder bound to it would be joined by — or would refuse to start
        // beside — a gate run somebody else launched.
        journeyDedicatedServerWithClient {
            server()
            programArgs '--nogui', '--port', '25701'
            property 'stagewright.autorun', 'true'
            property 'stagewright.awaitPlayer', 'true'
            property 'worlddriver.journey', 'true'
            property 'worlddriver.realPlayerBodies', 'true'
            property 'stagewright.scenes', 'wd.journey*'
            // A fixed port is exactly the thing that can already be taken, and a server that dies
            // on BindException does NOT take the JVM with it — architectury's transformer pools are
            // non-daemon, so the build waits forever on a process with no Server thread. Five
            // minutes is far past a cold worldgen and far short of a rung.
            property 'worlddriver.startupWatchdogMs', '300000'
            property 'worlddriver.rpcPort', '0'
            property 'worlddriver.mcpPort', '0'
            runDir 'run-journey-with-client'
            vmArg '-Xmx2g'
            source sourceSets.testmod
        }
        // Production topology, client half. Started for you as a companion of the server above — the
        // `doFirst` on `runJourneyDedicatedServerWithClient` at the bottom of this file does it. It
        // carries no scenes because it has no job beyond being a real player on the other end of a
        // real socket.
        journeyJoiningClient {
            client()
            property 'stagewright.client.connect', '127.0.0.1:25701'
            property 'worlddriver.rpcPort', '0'
            property 'worlddriver.mcpPort', '0'
            runDir 'run-journey-joining-client'
            vmArg '-Xmx2g'
        }
        // ONE upper rung, with its preconditions put there by hand (wd.rehearse*).
        //
        // The ladder above is one body climbing twenty rungs in sequence, which is the point of it
        // and also what makes its upper rungs nearly untestable: reaching rung 12 means replaying
        // eleven rungs and being lucky, at twenty-five minutes a try. Two committed fixes to rung 12
        // had therefore never once executed.
        //
        // This is NOT a second ladder and must never be read as one. It registers its scenes under
        // `wd.rehearse*` so no results file can carry a rehearsal under a ladder row's name, it
        // counts every arrangement through JourneyLedger.staged, and its verdict says
        // "REHEARSAL — not a climb, staging.calls=N". See JourneyRehearsal's class note.
        //
        //   ./gradlew :fabric:runRehearsalServer -Prehearse=PORTAL_LIT
        rehearsalServer {
            server()
            property 'stagewright.autorun', 'true'
            property 'worlddriver.journey', 'true'
            property 'worlddriver.journey.rehearse', project.findProperty('rehearse') ?: 'PORTAL_LIT'
            // The tick cap, exposed because one rung is not like the others. Most rehearse in a
            // minute; PORTAL_LIT makes ten round trips between a pool and a cell twelve blocks
            // below it, and a run that runs out of budget mid-cast reports a timeout where the
            // finding is "each trip costs N ticks". Raise it rather than read that twice:
            //   ./gradlew :fabric:runRehearsalServer -PrehearseBudget=120000
            //
            // EMPTY WHEN NOT ASKED FOR, like every other lever in this block — the default lives in
            // Java (JourneyRehearsal.DEFAULT_BUDGET, also 40 000), NOT here. Substituting '40000'
            // here made System.getProperty return a non-blank string on every run, so capFor's
            // "an explicit -PrehearseBudget wins outright" branch was taken ALWAYS and budgetFloor
            // was never consulted. Measured 2026-08-17: rung 20 declares 500 000 and got 40 000, and
            // the floor written to prevent exactly that was dead code from the day it landed. The
            // escape hatch was in Java; the build file held it permanently open.
            property 'worlddriver.journey.rehearse.budget',
                    (project.findProperty('rehearseBudget') ?: '').toString()
            // Make the portal rung's staircase audit TRIP. A healthy flight never faults, so the
            // repair that answers a fault would otherwise ship having never once run:
            //   ./gradlew :fabric:runRehearsalServer -Prehearse=PORTAL_LIT -PbreakAStair=true
            // Rehearsal-only twice over — this task always sets a rehearse target, and the rung
            // refuses the sabotage when none is set.
            property 'worlddriver.journey.breakAStair',
                    (project.findProperty('breakAStair') ?: 'false').toString()
            // Make the shaft's wet-column guard TRIP, and its remedy run. The flood that fires it is
            // random on a real climb — the same seed, the same column, dirt on one ladder run and
            // water on the next — so「换一根柱子」could only ever be verified by being unlucky at
            // twenty-five minutes a try:
            //   ./gradlew :fabric:runRehearsalServer -Prehearse=OBSIDIAN -PwetShaft=true
            // Same two locks as breakAStair: off unless asked for, and refused when no rung is being
            // rehearsed. See JourneyShaft.floodTheColumnOnce.
            property 'worlddriver.journey.wetShaft',
                    (project.findProperty('wetShaft') ?: 'false').toString()
            // Land rung 12's return ON the bottom step instead of in the cell above it. The flight's
            // last waypoint IS that step, and LEG_ARRIVED=1.5 calls a body one cell short "arrived",
            // so which of the two happened is invisible in the log — while it decides where the raise
            // starts, and therefore whether the cell pours or is lost. Naturally about one run in
            // three at eleven minutes a run:
            //   ./gradlew :fabric:runRehearsalServer -Prehearse=PORTAL_LIT -PshaftColumn=-8,19 -PlandOnFloor=true
            // Same two locks as breakAStair. It WALKS the step the flight skipped — no block and no
            // fluid is touched — which is why nothing in the alcove's own water can undo it. The
            // earlier `-PdryAlcove`, which cleared the stairwell's water instead, is gone: its own
            // staging rows disproved the theory it rested on (eight casts found ONE wet cell, the two
            // above it already air, and returnedY was 57 all eight times). Judge this by
            // `cast*.returnedY` on EVERY cast, and judge the flag itself by running it OFF too: that
            // run must still show the natural 57/56 mixture. See JourneyPortalRung.landOnFloor.
            property 'worlddriver.journey.landOnFloor',
                    (project.findProperty('landOnFloor') ?: 'false').toString()
            // Which side of the lava lake to stand the body on, which is what decides the forge's
            // orientation and therefore the whole alcove geometry:
            //   ./gradlew :fabric:runRehearsalServer -Prehearse=PORTAL_LIT -PforgeAway=north
            // Empty means "whichever spot the search finds first", which is what every rehearsal did
            // before this existed — one geometry, thirty runs. The real ladder picks a different one
            // nearly every climb, so four directed six-minute runs cover what ten twenty-minute
            // ladder runs only sample. See JourneyRehearsal.forcedSide for why the SIDE is staged
            // rather than the direction forced.
            property 'worlddriver.journey.forgeAway',
                    (project.findProperty('forgeAway') ?: '').toString()
            // The shaft column itself, which is the only lever that REPRODUCES a ladder's mould:
            //   ./gradlew :fabric:runRehearsalServer -Prehearse=PORTAL_LIT -PshaftColumn=-8,19
            // forgeAway can only ask for a side, and pickDigColumn answers it from its r>=2 ring —
            // but a climb reaches its column by adopting whatever it is standing on, which can be
            // r=1 and therefore unreachable by any side request. See JourneyRehearsal.stagedShaftColumn
            // for the measurement (ladder -8,19 vs rehearsal -9,21, same pool).
            property 'worlddriver.journey.shaftColumn',
                    (project.findProperty('shaftColumn') ?: '').toString()
            // How many buckets rung 12 starts with, which is what decides how many times it climbs
            // the staircase: it goes up only when the bag has no lava left, and fills every empty
            // bucket per visit, so the trips are ceil(10 / buckets-that-can-hold-lava).
            //   ./gradlew :fabric:runRehearsalServer -Prehearse=PORTAL_LIT -Pbuckets=4
            // Default 1, which is what the ladder's iron actually buys and therefore what a plain
            // rehearsal must reproduce byte for byte. The multi-bucket branch is unreachable on a
            // real climb, so this is the only thing that executes it — judge it by the trip count
            // (`lava*.loaded` / `lava*.up` rows), not by the colour. See JourneyRehearsal.stagedBuckets.
            property 'worlddriver.journey.buckets',
                    (project.findProperty('buckets') ?: '1').toString()
            // How many ender eyes rung 18 starts with. Default empty = twelve, which is what rung
            // 16's own rehearsal measured; this exists only to reach the short-stock branch that a
            // full bag can never run:
            //   ./gradlew :fabric:runRehearsalServer -Prehearse=END_PORTAL -Peyes=8
            // Judge it by `eyes.ranOutAt` and `frames.filled`, not by the colour — same rule as
            // buckets. See JourneyRehearsal.stagedEyes.
            property 'worlddriver.journey.eyes',
                    (project.findProperty('eyes') ?: '').toString()
            // How wide the STAGING's stronghold frame scan is. Default empty = rung 17's own
            // ROOM_SCAN_CHUNKS, and paying exactly that is the point: an 18-level rehearsal then
            // answers rung 17's open question (is ±96 blocks from the /locate START piece enough to
            // reach the portal room?) in minutes instead of an hour of marching.
            //   ./gradlew :fabric:runRehearsalServer -Prehearse=END_PORTAL -ProomScanChunks=12
            // It widens the STAGING only; rung 17 keeps its constant, or the question could never
            // be answered no. See JourneyRehearsal.roomScanChunks.
            property 'worlddriver.journey.roomScanChunks',
                    (project.findProperty('roomScanChunks') ?: '').toString()
            // Same body the ladder climbs on, and that is a deliberate answer rather than a copied
            // line. PORTAL_LIT itself does not need it: it is overworld-only, it spawns nothing and
            // it never asks for the dragon, so it would rehearse identically without the flag. But
            // the task takes ANY rung, and the flag is exactly what BLAZE_ROD and DRAGON depend on —
            // without it EndDragonFight.tick creates no dragon and BaseSpawner turns no fortress
            // spawner, both silently, so rehearsing them here would produce a green run in an empty
            // world. Parity is the other half: a fix proved on a body of a different kind from the
            // one the ladder uses is not proved for the ladder.
            property 'worlddriver.realPlayerBodies', 'true'
            property 'stagewright.scenes', 'wd.rehearse*'
            property 'worlddriver.rpcPort', '0'
            property 'worlddriver.mcpPort', '0'
            // Arm the startup watchdog: a server that fails to initialise leaves the JVM alive
            // (architectury's transformer pools are non-daemon) and the build waits on it forever.
            // Five minutes is far past a cold worldgen and far short of a rehearsal, so it can only
            // fire on a launch that is never going to happen.
            property 'worlddriver.startupWatchdogMs', '300000'
            runDir 'run-rehearsal'
            vmArg '-Xmx2g'
            source sourceSets.testmod
        }
        // The SAME rehearsal, on a body whose rotation belongs to a client.
        //
        // `rehearsalServer` above rehearses on a fake player, and a fake player is exactly the body
        // that cannot show the defect this task exists for: a real player's yaw/pitch are
        // client-authoritative, so a server-side `aimAtBlock` is overwritten by the next
        // `ServerboundMovePlayerPacket` — and the client, meanwhile, pulls pitch back to the horizon
        // every tick it is not bridging or diving. Rung 11 passes on the dedicated ladder and failed
        // on the client one for precisely that reason, on the same code and the same seed.
        //
        // So the two rehearsals answer different questions and BOTH are needed: the server one asks
        // "does this rung's plan work", this one asks "does it survive a body that argues back".
        // Without it, an aim fix can only be tested by climbing eleven rungs and being lucky.
        //
        //   ./gradlew :fabric:runRehearsalIntegratedServer -Prehearse=OBSIDIAN
        //
        // The levers below are the same properties `rehearsalServer` declares; the reasoning for
        // each one lives there and is deliberately NOT repeated here. Add a lever in both places or
        // in neither — a rehearsal that answers a question on one body and cannot be asked it on the
        // other is how the pair stops being a pair.
        rehearsalIntegratedServer {
            client()
            property 'stagewright.autorun', 'true'
            property 'stagewright.awaitPlayer', 'true'
            property 'stagewright.client.world', 'RehearsalClient'
            property 'stagewright.client.exitWhenDone', 'true'
            property 'worlddriver.journey', 'true'
            property 'worlddriver.journey.walkerDebug', (project.findProperty('walkerDebug') ?: '')
            property 'worlddriver.journey.rehearse', project.findProperty('rehearse') ?: 'PORTAL_LIT'
            property 'worlddriver.journey.rehearse.budget',
                    (project.findProperty('rehearseBudget') ?: '').toString()
            property 'worlddriver.journey.breakAStair',
                    (project.findProperty('breakAStair') ?: 'false').toString()
            property 'worlddriver.journey.wetShaft',
                    (project.findProperty('wetShaft') ?: 'false').toString()
            property 'worlddriver.journey.landOnFloor',
                    (project.findProperty('landOnFloor') ?: 'false').toString()
            property 'worlddriver.journey.forgeAway',
                    (project.findProperty('forgeAway') ?: '').toString()
            property 'worlddriver.journey.shaftColumn',
                    (project.findProperty('shaftColumn') ?: '').toString()
            property 'worlddriver.journey.buckets',
                    (project.findProperty('buckets') ?: '1').toString()
            property 'worlddriver.journey.eyes',
                    (project.findProperty('eyes') ?: '').toString()
            property 'worlddriver.journey.roomScanChunks',
                    (project.findProperty('roomScanChunks') ?: '').toString()
            property 'worlddriver.realPlayerBodies', 'true'
            property 'stagewright.scenes', 'wd.rehearse*'
            property 'worlddriver.rpcPort', '0'
            property 'worlddriver.mcpPort', '0'
            // Its own runDir: a rehearsal PLAYS its world exactly as the ladder does, and the two
            // rehearsals must not measure each other's dug shafts.
            runDir 'run-rehearsal-integrated'
            vmArg '-Xmx2g'
            source sourceSets.testmod
        }
    }
    runConfigs.configureEach {
        // contractServer and dogfoodServer pin their own ephemeral ports
        // (worlddriver.rpcPort/mcpPort='0') so the headless suites never compete with a live
        // dev client on 39800/39801. Without this guard the defaults below would clobber that.
        // The three self-driving topologies do the same.
        //
        // MATCHED BY PREFIX, not by a list of names. The list version silently stopped covering
        // the ladder the moment it grew a second and third topology: `journeyIntegratedServer` and
        // `journeyDedicatedServerWithClient` matched no clause, fell through, and had their
        // ephemeral ports overwritten with the pinned pair — which on the two-process topology is
        // two JVMs binding one port, and everywhere is a run that fights a live dev client. A guard
        // whose failure mode is「a config added later is quietly not covered」has to be a rule about
        // the family, not an enumeration of it.
        if (it.name == 'contractServer' || it.name == 'dogfoodServer'
                || it.name.startsWith('journey') || it.name.startsWith('rehearsal')
                || it.name.startsWith('stagewright')) return
        property 'worlddriver.runValidation', project.findProperty('agentRunValidation') ?: 'false'
        // Pin the MCP / RPC ports so the external driver (Claude harness, docs
        // example, rpc.py) always finds the mod at a known address. Default to
        // 39800/39801; WorldDriverCommon reads -Dworlddriver.mcpPort / -Dworlddriver.rpcPort
        // (0 = random). Override with -PagentMcpPort=… / -PagentRpcPort=… if two
        // clients must coexist.
        property 'worlddriver.mcpPort', project.findProperty('agentMcpPort') ?: '39800'
        property 'worlddriver.rpcPort', project.findProperty('agentRpcPort') ?: '39801'
        // Persist mc.bot.setting changes to config/worlddriver_bot.properties so
        // survival toggles (autoSwim, autoRetreat, …) survive a client restart and
        // don't have to be re-applied every relaunch. Opt-in (set only on the dev
        // runClient/runServer launch, NOT the dogfood/testkit runs) so the
        // validation suites stay deterministic on pure defaults. Override with
        // -PagentPersistConfig=false.
        property 'worlddriver.persistConfig', project.findProperty('agentPersistConfig') ?: 'true'
        // Cap heap so a stuck client/server can't trigger system OOM when run
        // alongside the dogfood/testkit server. MC 1.21.1 fits comfortably.
        vmArg '-Xmx2g'
    }
}

// The scene scripts a modpack author would ship, delivered into the dogfood run the way a pack
// delivers them: config/stagewright/scenes. The gate task provisions these itself, so this exists
// for the BARE `:fabric:runDogfoodServer` — run that directly and nothing else installs the scenes,
// leaving whatever copy the directory last held. It held a two-day-old one, and the expect-file
// gate caught it only because a scene had been added.
// Sync rather than Copy: a scene deleted upstream must not keep running here.
def installDogfoodScenes = tasks.register('installDogfoodScenes', Sync) {
    from rootProject.file('stagewright-scenes')
    include '*.js'
    into layout.projectDirectory.dir('run-dogfood/config/stagewright/scenes')
}
// Capability descriptors travel with the scenes and split by extension, exactly as the plugin's
// provisioning does — a pack author authors both in one folder, and the bare run must not be the
// one path where half of that folder goes missing.
def installDogfoodCapabilities = tasks.register('installDogfoodCapabilities', Sync) {
    from rootProject.file('stagewright-scenes')
    include '*.json'
    into layout.projectDirectory.dir('run-dogfood/config/stagewright/capabilities')
}
tasks.named('runDogfoodServer') { dependsOn installDogfoodScenes, installDogfoodCapabilities }

// ---- The journey run provisions its own directory. ----
//
// The six gates get theirs from the stagewright plugin's provision step, which writes the EULA and
// FORCES `level-seed`. This run is not one of them, so both are on us — and the seed is not a
// nicety here, it is the premise. Every coordinate in JourneyRoute is a statement about seed 5471;
// booting on a random seed would put the bot in a different world and report "could not gather
// wood" rather than "this is the wrong world". wd.journey01Recon asserts the seed for exactly that
// reason, so a missing line here fails loudly instead of quietly — but it should not be missing.
//
// The value is duplicated from StageWright's RunDirectory.FIXED_SEED / ClientDirector.WORLD_SEED,
// which already duplicate each other for the reason documented there: the two live in builds that
// cannot see one another. This is a third copy with the same excuse, and the recon assertion is
// what keeps all three honest.
//
// FIVE runs need this, identically: the rehearsal and the ladder's three topologies. They get
// separate directories because they are separate worlds — a rehearsal digs a shaft and casts a
// portal frame, and a ladder that inherited that would measure the rehearsal, which is the same trap
// the deletion below exists to close one level down. Two LADDERS sharing one is worse still: each
// would report the other's felled trees as its own missing ones.
//
// `port` is the server port to write. 0 → the OS picks one, which is right for a server nobody dials.
// The production-topology half is dialled by name, so it says its number here as well as on the
// command line — `--port` wins either way, and two places that disagree is a question somebody has to
// answer at the worst possible moment.
def provisionRun = { String taskName, String dirName, String what, String port = '0' ->
  tasks.register(taskName) {
    description = "Seed fabric/${dirName} with the EULA and the fixed world seed ${what} is written against."
    def runDir = layout.projectDirectory.dir(dirName).asFile
    outputs.upToDateWhen { false }
    doLast {
        runDir.mkdirs()
        // ---- A journey must start from an unplayed world. ----
        //
        // This is the dirty-world trap the workspace notes already record for the gates, and it
        // bites harder here. The gates build their own arenas and mostly overwrite what they find;
        // a playthrough PLAYS the world, so run 2 begins with run 1's tree already felled, its ore
        // already pulled and its shafts already dug. Every symptom of that reads as a bot bug —
        // "could not gather wood" at a coordinate the survey swears has a tree — and the survey
        // guard would fire on the tree run 1 legitimately cut, accusing the seed.
        //
        // So the world is deleted, not reused. The cost is a fresh worldgen per run, which is
        // seconds; the alternative is a suite whose second run measures its first.
        //
        // BOTH layouts, because the ladder now runs under a client too: a dedicated server keeps its
        // world at <run>/world, a client keeps its saves under <run>/saves. Deleting only the one
        // this directory happens to use today would leave the client topology reusing a played world
        // forever — and reusing one is invisible until a rung fails for a reason the seed cannot
        // explain. Same rule the framework's own RunDirectory.provision follows.
        ['world', 'saves'].each { name ->
            def stale = new File(runDir, name)
            if (stale.exists() && !stale.deleteDir()) {
                throw new GradleException("could not delete ${stale} — a journey run must start from"
                        + " an unplayed world, and reusing one makes run N measure run N-1."
                        + " On Windows the usual cause is ANOTHER RUN STILL HOLDING THIS DIRECTORY:"
                        + " check for live java.exe before blaming the disk. Two runs sharing a run"
                        + " dir is not a slow run, it is two runs destroying each other's world.")
            }
        }
        // ---- A results file that survives a dead run answers for it. ----
        //
        // The gates get this from the plugin's provision step and these runs did not, which was
        // survivable while there was one ladder and nobody diffed its output. It is not survivable
        // now: comparing three topologies means reading three results files, and a run that dies
        // before writing a header leaves the PREVIOUS run's complete, valid, plausible file exactly
        // where the reader expects this one. The heartbeat beside it lies in a way the results file
        // cannot — it names a scene, so a stale one reports last run's position as this one's.
        // The companion client's file is in the companion's own directory and is swept by that
        // directory's own provision task, not from here.
        ['stagewright-results.jsonl', 'stagewright-client-results.jsonl',
         'stagewright-progress.json'].each { name ->
            def stale = new File(runDir, name)
            if (stale.exists() && !stale.delete()) {
                throw new GradleException("could not delete ${stale} — judging a run against the"
                        + " previous run's results is worse than judging it against nothing, because"
                        + " the leftover file is complete and looks entirely normal.")
            }
        }
        new File(runDir, 'eula.txt').text = 'eula=true\n'
        // Three client settings, written unconditionally because a dedicated server never reads the
        // file and guessing the run type here would be one more thing to keep in step. The first is
        // the one that matters on this box: vanilla singleplayer PAUSES when the window loses focus,
        // which on a desktop happens constantly and stops the integrated server dead — a ladder rung
        // does not fail, it simply stops advancing, and the run reports a step timeout on whatever
        // leg was in flight when somebody alt-tabbed. Copied from StageWright's own
        // RunDirectory.seedClientOptions; Minecraft merges the keys it does not find with its
        // defaults, so a three-line file is a complete one.
        new File(runDir, 'options.txt').text =
                'pauseOnLostFocus:false\nonboardAccessibility:false\nnarrator:0\n'
        def properties = new File(runDir, 'server.properties')
        def body = properties.exists() ? properties.text : ''
        // server-port=0 → the OS assigns a free one. Nobody connects to most of these servers; a
        // fixed port buys nothing and costs collisions. Measured cost of one such collision: a second
        // rehearsal died at `java.net.BindException: Address already in use: bind`, NPE'd in
        // stopServer with a half-built level, and then the JVM did not exit — architectury's
        // transformer pools are non-daemon, so the build hung for 5.5 hours reporting nothing.
        ['level-seed': '5471', 'online-mode': 'false', 'server-port': port].each { key, value ->
            def line = "${key}=${value}"
            if (body =~ /(?m)^${java.util.regex.Pattern.quote(key)}\s*=.*$/) {
                body = body.replaceAll(/(?m)^${java.util.regex.Pattern.quote(key)}\s*=.*$/, line)
            } else {
                body = body + (body.endsWith('\n') || body.isEmpty() ? '' : '\n') + line + '\n'
            }
        }
        properties.text = body
    }
  }
}
def provisionJourneyRun = provisionRun('provisionJourneyRun', 'run-journey', 'the journey')
def provisionRehearsalRun = provisionRun('provisionRehearsalRun', 'run-rehearsal', 'the rehearsal')
// The client topology creates its own world through WorldOpenFlows rather than from
// server.properties, at ClientDirector.WORLD_SEED — which is the same 5471 for the reason documented
// at the top of this block. The seed line still goes in: it costs nothing and it keeps a reader from
// having to know which of the two mechanisms this directory happens to use.
def provisionJourneyIntegratedRun =
        provisionRun('provisionJourneyIntegratedRun', 'run-journey-integrated', 'the journey')
def provisionJourneyWithClientRun =
        provisionRun('provisionJourneyWithClientRun', 'run-journey-with-client', 'the journey', '25701')
def provisionJourneyJoiningClientRun =
        provisionRun('provisionJourneyJoiningClientRun', 'run-journey-joining-client', 'the journey')
// The client rehearsal needs its own, and needing it is not optional: every rehearsal stands the
// body at coordinates baked from seed 5471, so a directory provisioned without that seed rehearses
// a rung against terrain it was never written for — and it does that GREENLY, staging its kit into
// whatever happens to be there. This line is the difference between a rehearsal and a fiction.
def provisionRehearsalIntegratedRun =
        provisionRun('provisionRehearsalIntegratedRun', 'run-rehearsal-integrated', 'the rehearsal')
tasks.named('runJourneyServer') { dependsOn provisionJourneyRun }
tasks.named('runRehearsalServer') { dependsOn provisionRehearsalRun }
tasks.named('runRehearsalIntegratedServer') { dependsOn provisionRehearsalIntegratedRun }
tasks.named('runJourneyIntegratedServer') { dependsOn provisionJourneyIntegratedRun }
tasks.named('runJourneyDedicatedServerWithClient') {
    dependsOn provisionJourneyWithClientRun, provisionJourneyJoiningClientRun
}
tasks.named('runJourneyJoiningClient') { dependsOn provisionJourneyJoiningClientRun }

// ---- The ladder's production topology is two games, and Gradle runs tasks one at a time. ----
//
// `runJourneyDedicatedServerWithClient` and `runJourneyJoiningClient` have to OVERLAP: the server
// holds its suite back until a player joins (`stagewright.awaitPlayer`), and the player is the other
// task. Asking Gradle for both would run the server to completion first and then start a client for
// a suite that is over — so the client is launched as a detached process from inside the server
// task's own action, exactly the way the stagewright plugin does it for the gate twin.
//
// Reusing the plugin's build SERVICE rather than a ProcessBuilder of our own is the whole point:
// Gradle closes a build service on EVERY exit path — success, failure, task timeout, Ctrl-C — and a
// leaked game client holds its run directory open, so the next run's provisioning cannot delete the
// world and the failure that follows reads as a scene bug. Teardown in a doLast is skipped exactly
// when the run failed, which is when a leak is most likely.
//
// The command line is copied off the companion's own JavaExec spec, so loom stays the only thing
// that knows what a dev run looks like. That means the companion's task dependencies have to have
// run — hence dependsOn on both its declared dependencies and whatever produces its inputs (a run
// task's classpath carries its own build dependencies, which are NOT in dependsOn; without this the
// client is handed a path to a jar nothing has built).
def journeyCompanionService = gradle.sharedServices.registerIfAbsent('stagewrightSideProcesses',
        net.magicterra.stagewright.gradle.StageWrightSideProcessService) {}
tasks.named('runJourneyDedicatedServerWithClient') {
    def companion = tasks.getByName('runJourneyJoiningClient')
    dependsOn companion.dependsOn
    dependsOn companion.inputs.files
    // Reading another task's JavaExec spec at execution time captures a Task, which the
    // configuration cache cannot serialize. Declared rather than discovered: left unsaid, a build
    // with the cache on fails with Gradle's own message naming loom's run task class and nothing
    // about companions.
    notCompatibleWithConfigurationCache('the journey production topology starts its companion client'
            + ' from another task\'s JavaExec spec, which cannot be serialized into the'
            + ' configuration cache')
    def companionLog = layout.projectDirectory.file('run-journey-with-client/companion-client.log').asFile
    doFirst {
        companionLog.parentFile.mkdirs()
        journeyCompanionService.get().startCompanion(companion, companionLog, null, logger)
    }
}
