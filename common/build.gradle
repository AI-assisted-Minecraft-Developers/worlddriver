plugins {
    id 'worlddriver.base'
    id 'net.neoforged.moddev'
    id 'worlddriver.mod'
}

neoForge {
    // Vanilla in Mojang names, the one NeoForge $neoforge_version is built on. The access transformer at its default
    // place, META-INF/accesstransformer.cfg, is applied to it; both loaders compile these sources again with their
    // own access file (the widener on Fabric). See docs/dev/build.md.
    enable {
        neoFormVersion = rootProject.neoform_version
        // Applied to the compiled game, not to its decompiled source: recompiled, a widened slider method would be
        // more open than the protected overrides vanilla declares, which javac refuses.
        disableRecompilation = true
    }
}

// testmod source set — the in-game tests StageWright runs and the test content (validation
// scripts, NPCs) live here so they are compiled ONLY for dev/test runs and NEVER baked into a
// shipped jar. Each loader compiles these sources into its own testmod (the worlddriver.loader plugin);
// :common compiles them only to check them and for the unit tests below. testmod sees
// main's OUTPUT plus main's own compile/runtime classpaths, and StageWright's api (below).
// The `test` source set is for PURE-JVM unit tests of code that needs no running
// game — the transports (JSON-RPC framing, RpcServer/RpcClient wire contract) are
// the motivating case: they are plain Netty + java.util and were previously only
// reachable by running the game, which is why their framing bugs (an error
// frame with no `id`, a client that took "the next frame" as its response) survived
// every in-game run. Anything that touches world state belongs in `testmod` as an
// in-game test, not here.
//
// runtimeClasspath deliberately extends main's COMPILE classpath, not its runtime
// one: netty-codec-http is `compileOnly` for main (the loader modules shadow-bundle
// it), so a test inheriting main.runtimeClasspath would compile and then
// NoClassDefFoundError on the first WebSocket frame.
sourceSets {
    testmod {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
    test {
        // testmod's output too, for unit tests of testmod code. Still main's COMPILE
        // classpath, for the reason above.
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output + sourceSets.testmod.output
        runtimeClasspath += sourceSets.main.compileClasspath + sourceSets.main.output + sourceSets.testmod.output
    }
}

neoForge {
    addModdingDependenciesTo(sourceSets.testmod)
    addModdingDependenciesTo(sourceSets.test)
}

// Published as the same jar under both names: nothing here is remapped.
ext.shippedJar = tasks.named('jar')
ext.devJar = tasks.named('jar')

dependencies {
    // The api module; the loader modules compile both from source.
    implementation project(':api')

    // StageWright's test API (net.magicterra.stagewright.test) for the in-game tests.
    //
    // The API ONLY, never the runtime. Depending on mc_stagewright-common here would be a
    // version CYCLE — that module compiles against worlddriver-common — which is exactly
    // why the api module was split out before the repos separated.
    //
    // `:dev` is the Mojang-named jar, the names this compile classpath uses. The plain
    // artifact is intermediary and would fail to link.
    // Not transitive: its POM names worlddriver-api, which is this build's own :api.
    testmodImplementation("net.magicterra:mc_stagewright-api:${rootProject.stagewright_version}:dev") {
        transitive = false
    }
    // The unit tests see testmod's classes (sourceSets above), so they need what those link against.
    testImplementation("net.magicterra:mc_stagewright-api:${rootProject.stagewright_version}:dev") {
        transitive = false
    }
    // The JUnit tests StageWright runs inside the game; its loader jar ships the runtime.
    testmodImplementation platform('org.junit:junit-bom:5.11.3')
    testmodImplementation 'org.junit.jupiter:junit-jupiter-api'
    testmodImplementation 'org.junit.jupiter:junit-jupiter-params'

    // Same pin StageWright's junit module uses — one JUnit version across both repos.
    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging { events "failed" }
}

repositories {
    maven {
        name = 'latvian-releases'
        url = 'https://maven.latvian.dev/releases'
        // Fenced because Gradle takes the first repository that answers: an expired domain's
        // parking page answering 200 to every path would shadow every repository after it.
        content { includeGroup 'dev.latvian.mods' }
    }
}

dependencies {
    // The mixin annotations; each loader brings its own Mixin at run time.
    compileOnly "org.spongepowered:mixin:$rootProject.mixin_version"

    // stagewright is NOT a main dependency — that edge is what put the test framework in the
    // shipped jar. Only the `testmod` source set compiles against it, declared in the block above.

    // Rhino JS engine (KubeJS fork) — common because both platforms use it
    implementation "dev.latvian.mods:rhino:$rootProject.rhino_version"

    // Netty WebSocket — MC ships only the core (transport/codec). We need
    // codec-http for the WS server/client. Compile-only here; each loader nests it
    // in its jar and, on NeoForge, puts it on the dev runs' classpath.
    compileOnly "io.netty:netty-codec-http:$rootProject.netty_version"
}

// The API artifacts are :api's to generate; this project checks them and ships them in the mod jar.
evaluationDependsOn(':api')
def generatedApiDir = project(':api').layout.buildDirectory.dir('generated/worlddriver-api')
def generateApiArtifacts = project(':api').tasks.named('generateApiArtifacts')

// Gradle fetches a pinned Node, so the TypeScript check runs without one on the PATH.
apply plugin: 'com.github.node-gradle.node'
node {
    download = true
    version = '22.12.0'
}

def apiTypesChecked = layout.buildDirectory.file('checkApiTypes/ok')
def checkApiTypes = tasks.register('checkApiTypes', com.github.gradle.node.npm.task.NpxTask) {
    group = 'verification'
    description = 'Type-checks src/apiTypes/usage.ts against the generated declarations with TypeScript 5.9.3.'
    dependsOn generateApiArtifacts
    command = '--yes'
    args = [
        '--package=typescript@5.9.3',
        '--',
        'tsc',
        '--noEmit',
        '--strict',
        '--target',
        'es2020',
        '--lib',
        'es2020',
        'src/apiTypes/usage.ts'
    ]
    inputs.dir(generatedApiDir)
    inputs.file('src/apiTypes/usage.ts')
    outputs.file(apiTypesChecked)
    doLast { apiTypesChecked.get().asFile.text = 'ok' }
}
tasks.named('check') { dependsOn checkApiTypes }

// The skill's method manual is generated but committed, so an agent reads it without a build. See docs/dev/api-artifacts.md.
def skillManual = rootProject.file('.agents/skills/worlddriver-rpc/references/methods.md')
tasks.register('updateSkillManual', Copy) {
    group = 'build'
    description = 'Writes the generated method manual into the worlddriver-rpc skill.'
    dependsOn generateApiArtifacts
    from(generatedApiDir) {
        include 'skill-methods.md'
        rename { 'methods.md' }
    }
    into skillManual.parentFile
}
def checkSkillManual = tasks.register('checkSkillManual') {
    group = 'verification'
    description = 'Fails when the committed skill manual differs from the generated one.'
    dependsOn generateApiArtifacts
    mustRunAfter 'updateSkillManual'
    def generated = generatedApiDir.map { it.file('skill-methods.md') }
    inputs.file(generated)
    inputs.file(skillManual)
    def committed = skillManual
    doLast {
        if (generated.get().asFile.text != committed.text) {
            throw new GradleException("${committed} is stale; run ./gradlew :common:updateSkillManual and commit it")
        }
    }
}
tasks.named('check') { dependsOn checkSkillManual }

// The generated files the mod jar carries; each loader's processResources takes them too.
ext.generatedApiResources = copySpec {
    from(generatedApiDir) {
        include 'driver-api.js'
        into 'data/worlddriver/scripts/generated'
    }
    from(generatedApiDir) {
        exclude 'driver-api.js', 'skill-methods.md'
        into 'worlddriver-api'
    }
}
tasks.named('processResources') {
    dependsOn generateApiArtifacts
    with generatedApiResources
}
