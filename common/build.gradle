architectury {
    common rootProject.enabled_platforms.split(',')
}

loom {
    // Access widener (see the file's header for why). Declared on :common and
    // referenced by both platform modules, so one list of widened members serves
    // every artifact and cannot drift between loaders.
    accessWidenerPath = file("src/main/resources/worlddriver.accesswidener")
}

// P4a Task 2: testmod source set — the wd.* dogfood scenes (WorldDriverScenes) +
// the sim probe helpers (SimProbes) + the SceneProvider service file live here so
// they are compiled ONLY for dev/test runs and NEVER baked into the remapped
// production jar (common's transformProductionNeoForge/Fabric transforms only the
// `main` output). The loader modules (neoforge/fabric) attach THIS source set's
// OUTPUT to their dev runs; :common itself never runs, so no loom mods{} wiring is
// needed here. Classpath mirrors the neoforge testmod convention: testmod sees
// main's OUTPUT plus main's own compile/runtime classpaths — so scene/probe code
// can reach main classes (Walker, ServerWorldDriver, …) AND main's dependencies
// (Minecraft, netty compileOnly), while the testkit scene SPI
// (Scene/SceneContext/SceneProvider) comes from :stagewright-common namedElements
// (added explicitly below AND already transitively present in main.compileClasspath).
// The `test` source set is for PURE-JVM unit tests of code that needs no running
// game — the transports (JsonCodec framing, RpcServer/RpcClient wire contract) are
// the motivating case: they are plain Netty + java.util and were previously only
// reachable through a full dogfood run, which is why their framing bugs (an error
// frame with no `id`, a client that took "the next frame" as its response) survived
// every gate. Anything that touches world state belongs in `testmod` as a scene,
// not here.
//
// runtimeClasspath deliberately extends main's COMPILE classpath, not its runtime
// one: netty-codec-http is `compileOnly` for main (the loader modules shadow-bundle
// it), so a test inheriting main.runtimeClasspath would compile and then
// NoClassDefFoundError on the first WebSocket frame.
sourceSets {
    testmod {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
    test {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
    }
}

dependencies {
    // StageWright's scene SPI (Scene/SceneContext/SceneProvider) for the wd.* scenes.
    //
    // The API ONLY, never the runtime: the scenes need those three types to DECLARE
    // themselves and nothing else. Depending on mc_stagewright-common here would be a
    // version CYCLE — that module compiles against worlddriver-common — which is exactly
    // why the api module was split out before the repos separated.
    //
    // `:dev` is the named-mappings jar. Not a `mod*` configuration, so loom does not remap
    // it, which is correct: the dev jar is already in the mappings this compile classpath
    // uses. The plain artifact is intermediary and would fail to link.
    testmodImplementation "net.magicterra:mc_stagewright-api:${rootProject.stagewright_version}:dev"

    // Same pin StageWright's junit module uses — one JUnit version across both repos.
    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging { events "failed" }
}

repositories {
    maven {
        name = 'latvian-releases'
        url = 'https://maven.latvian.dev/releases'
    }
}

dependencies {
    // Provides the @Environment annotation; do NOT use other Fabric Loader classes from common
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // stagewright-common (P1.6 Task 2) — the dogfood scenes (WorldDriverScenes) + the
    // SceneProvider service now live in this common module, so the testkit scene SPI
    // (Scene/SceneContext/SceneProvider) is needed on the common COMPILE classpath.
    // architectury common→common consumption idiom = plain namedElements project dep
    // (the loom `common()`/`shadowBundle` transform pair is for PLATFORM modules only;
    // runtime bundling of stagewright-common into the loader jars stays in neoforge/fabric).
    // stagewright is NOT a main dependency — that edge is what put the test framework in the
    // shipped jar. Only the `testmod` source set compiles against it (the wd.* scenes need
    // Scene/SceneContext/SceneProvider), declared in the testmod block above.

    // Rhino JS engine (KubeJS fork) — common because both platforms use it
    implementation "dev.latvian.mods:rhino:$rootProject.rhino_version"

    // Netty WebSocket — MC ships only the core (transport/codec). We need
    // codec-http for the WS server/client. Compile-only here; fabric/neoforge
    // wire runtime visibility (forgeRuntimeLibrary on NeoForge) + shadow-bundle.
    compileOnly "io.netty:netty-codec-http:$rootProject.netty_version"

}
