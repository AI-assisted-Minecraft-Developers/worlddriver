architectury {
    common rootProject.enabled_platforms.split(',')
}

loom {
    // Access widener (see the file's header for why). Declared on :common and
    // referenced by both platform modules, so one list of widened members serves
    // every artifact and cannot drift between loaders.
    accessWidenerPath = file("src/main/resources/agent_driver.accesswidener")
}

// P4a Task 2: testmod source set — the ad.* dogfood scenes (AgentDriverScenes) +
// the sim probe helpers (SimProbes) + the SceneProvider service file live here so
// they are compiled ONLY for dev/test runs and NEVER baked into the remapped
// production jar (common's transformProductionNeoForge/Fabric transforms only the
// `main` output). The loader modules (neoforge/fabric) attach THIS source set's
// OUTPUT to their dev runs; :common itself never runs, so no loom mods{} wiring is
// needed here. Classpath mirrors the neoforge testmod convention: testmod sees
// main's OUTPUT plus main's own compile/runtime classpaths — so scene/probe code
// can reach main classes (Walker, ServerAgentDriver, …) AND main's dependencies
// (Minecraft, netty/snakeyaml compileOnly), while the testkit scene SPI
// (Scene/SceneContext/SceneProvider) comes from :testkit-common namedElements
// (added explicitly below AND already transitively present in main.compileClasspath).
// The `test` source set is for PURE-JVM unit tests of code that needs no running
// game — the transports (JsonCodec framing, RpcServer/RpcClient wire contract) are
// the motivating case: they are plain Netty + java.util and were previously only
// reachable through a full dogfood run, which is why their framing bugs (an error
// frame with no `id`, a client that took "the next frame" as its response) survived
// every gate. Anything that touches world state belongs in `testmod` as a scene,
// not here.
//
// runtimeClasspath deliberately extends main's COMPILE classpath, not its runtime
// one: netty-codec-http and snakeyaml are `compileOnly` for main (the loader modules
// shadow-bundle them), so a test inheriting main.runtimeClasspath would compile and
// then NoClassDefFoundError on the first WebSocket frame.
sourceSets {
    testmod {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
    test {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
    }
}

dependencies {
    // testkit scene SPI (Scene/SceneContext/SceneProvider) for the moved scenes —
    // same architectury common→common namedElements idiom as main's testkit-common dep.
    testmodImplementation project(path: ':testkit-common', configuration: 'namedElements')

    // Same pin as mc-testkit/junit — one JUnit version across the build.
    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging { events "failed" }
}

repositories {
    maven {
        name = 'latvian-releases'
        url = 'https://maven.latvian.dev/releases'
    }
}

dependencies {
    // Provides the @Environment annotation; do NOT use other Fabric Loader classes from common
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // testkit-common (P1.6 Task 2) — the dogfood scenes (AgentDriverScenes) + the
    // SceneProvider service now live in this common module, so the testkit scene SPI
    // (Scene/SceneContext/SceneProvider) is needed on the common COMPILE classpath.
    // architectury common→common consumption idiom = plain namedElements project dep
    // (the loom `common()`/`shadowBundle` transform pair is for PLATFORM modules only;
    // runtime bundling of testkit-common into the loader jars stays in neoforge/fabric).
    implementation project(path: ':testkit-common', configuration: 'namedElements')

    // Rhino JS engine (KubeJS fork) — common because both platforms use it
    implementation "dev.latvian.mods:rhino:$rootProject.rhino_version"

    // Netty WebSocket — MC ships only the core (transport/codec). We need
    // codec-http for the WS server/client. Compile-only here; fabric/neoforge
    // wire runtime visibility (forgeRuntimeLibrary on NeoForge) + shadow-bundle.
    compileOnly "io.netty:netty-codec-http:$rootProject.netty_version"

    // snakeyaml — YAML GameTest definitions. Compile-only here; fabric/neoforge
    // wire runtime visibility + shadow-bundle (relocated). See gradle.properties.
    compileOnly "org.yaml:snakeyaml:$rootProject.snakeyaml_version"
}
