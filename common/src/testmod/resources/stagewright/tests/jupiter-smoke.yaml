# YAML tests against the live game: a call checked by expect, a saved value read back, waits, and a step that
# jupiter-smoke.js registers.
scene: wd.jupiterSmoke
tests:
  - name: a call's reply meets its expectation
    steps:
      - call: mc.world.block
        params: { pos: { x: 0, y: 319, z: 0 } }
        expect:
          pos.y: { equals: 319 }
          light.sky: { atLeast: 0, atMost: 15 }
          anyOf:
            - { type: { equals: "minecraft:air" } }
            - { type: { equals: "minecraft:void_air" } }

  - name: a block filled into the plot reads back where it was saved
    plot: { size: 8 }
    given:
      - call: mc.world.block
        params: { pos: "${plot.origin}" }
        expect: { type: { equals: "minecraft:air" } }
    when:
      - call: mc.action.fill
        params: { from: "${plot.origin}", to: "${plot.origin}", type: "minecraft:gold_block" }
    then:
      - call: mc.world.block
        params: { pos: "${plot.origin}" }
        save: block
      - wd.blockType: "${block.pos}"
        expect: { equals: "minecraft:gold_block" }

  - name: a condition is waited for and then held
    steps:
      - waitUntil:
          call: mc.world.block
          params: { pos: { x: 0, y: 319, z: 0 } }
          expect: { type: { equals: "minecraft:air" } }
        within: 20
      - settle:
          call: mc.world.block
          params: { pos: { x: 0, y: 319, z: 0 } }
          expect: { type: { equals: "minecraft:air" } }
        ticks: 3
        within: 20
      - wait: 2
