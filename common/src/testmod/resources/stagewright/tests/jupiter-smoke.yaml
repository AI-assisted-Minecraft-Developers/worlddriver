# YAML tests against the live game: a call checked by expect, a saved value read back, waits, and a step that
# jupiter-smoke.js registers.
scene: wd.jupiterSmoke
tests:
  - name: a call's reply meets its expectation
    steps:
      - call: mc.world.block
        params: { pos: { x: 0, y: 319, z: 0 } }
        expect:
          pos.y: { equals: 319 }
          light.sky: { atLeast: 0, atMost: 15 }
          anyOf:
            - { type: { equals: "minecraft:air" } }
            - { type: { equals: "minecraft:void_air" } }

  - name: a block filled into the plot reads back where it was saved
    plot: { size: 8 }
    given:
      - call: mc.world.block
        params: { pos: "${plot.origin}" }
        expect: { type: { equals: "minecraft:air" } }
    when:
      - call: mc.action.fill
        params: { from: "${plot.origin}", to: "${plot.origin}", type: "minecraft:gold_block" }
    then:
      - call: mc.world.block
        params: { pos: "${plot.origin}" }
        save: block
      - wd.blockType: "${block.pos}"
        expect: { equals: "minecraft:gold_block" }

  - name: a barrel keeps its items across its chunk unloading and reloading
    plot: { size: 8 }
    given:
      - place: { at: [2, 1, 2], block: "minecraft:barrel", as: barrel }
      - insert: { into: barrel, items: { "minecraft:diamond": 7, "minecraft:cobblestone": 70 } }
    when:
      - chunk.unload: barrel
      - chunk.reload: { at: barrel, within: 400 }
    then:
      - container: { of: barrel, equals: { "minecraft:diamond": 7, "minecraft:cobblestone": 70 } }
      - call: mc.world.block
        params: { pos: "${barrel}" }
        expect: { type: { equals: "minecraft:barrel" } }

  - name: a known issue is taken out of the reply before it is checked
    plot: { size: 8 }
    given:
      - place: { at: [2, 1, 2], block: "minecraft:stone", as: middle }
      - place: { at: [3, 1, 2], block: "minecraft:glass" }
    then:
      - call: mc.query
        params: { q: blocks, center: "${middle}", filter: { in_radius: 2 }, select: [type] }
        knownIssues:
          - { type: "minecraft:glass", reason: "stands in for a block a pack is known to get wrong" }
        expect: { blocks: { equals: [ { type: "minecraft:stone" } ] } }

  # Short windows, and only what holds on any machine: the step's shape, not a threshold.
  - name: perf measures a baseline and a phase after it
    plot: { size: 8 }
    steps:
      - perf:
          warmup: 10
          sample: 40
          repeat: 2
          phases:
            - name: baseline
            - name: filled
              steps:
                - call: mc.action.fill
                  params: { from: "${plot.origin}", to: "${plot.origin}", type: "minecraft:stone" }
        expect:
          baseline: { ticks: { equals: 40 }, tps: { gt: 0, atMost: 20 } }
          filled: { msptP99: { gt: 0 }, tpsDrop: { lt: 1 }, heapGrowthMib: { gt: -100000 }, cpu: { gt: 0 } }

  - name: a java step reads what a fill left behind
    plot: { size: 8 }
    given:
      - call: mc.action.fill
        params: { from: "${plot.origin}", to: "${plot.origin}", type: "minecraft:gold_block" }
    then:
      - java: { class: net.magicterra.worlddriver.bot.stagewright.jupiter.YamlJavaSteps, method: blockAt }
        params: { pos: "${plot.origin}" }
        expect: { type: { equals: "minecraft:gold_block" }, y: { equals: "${plot.origin.y}" } }
      - wd.blockAt: { pos: "${plot.origin}" }
        expect: { type: { equals: "minecraft:gold_block" } }

  - name: a condition is waited for and then held
    steps:
      - waitUntil:
          call: mc.world.block
          params: { pos: { x: 0, y: 319, z: 0 } }
          expect: { type: { equals: "minecraft:air" } }
        within: 20
      - settle:
          call: mc.world.block
          params: { pos: { x: 0, y: 319, z: 0 } }
          expect: { type: { equals: "minecraft:air" } }
        ticks: 3
        within: 20
      - wait: 2
