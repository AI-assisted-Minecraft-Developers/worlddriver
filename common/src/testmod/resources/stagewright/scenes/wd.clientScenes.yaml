# worlddriver's client families (the old wd.client* scenes): a dedicated server with a real client joined to it, as
# the old with-client gate ran them, so the client navigator drives the client's own player over the wire. The world
# is the headless families' (wd.scenes.yaml): seed 5471 on the normal world, easy, frozen midnight, clear frozen
# weather, no mob spawning. Classes here carry @Requires(CLIENT) and drive the player through kit.ClientRig.
topology: dedicatedServerWithClient
world:
  preset: minecraft:normal
  seed: 5471
  structures: true
  gamemode: survival
  difficulty: easy
  time: { at: midnight, frozen: true }
  weather: { clear: true, thunder: false, frozen: true }
  mobSpawning: false
