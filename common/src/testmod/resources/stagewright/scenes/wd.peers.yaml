# Two dedicated servers: the game, which runs the tests, and peer b, which serves them over its WorldDriver. A flat
# world on each, so both come up quickly. The peer's file is how a test tells which server it reads.
topology: dedicatedServer
world:
  preset: minecraft:flat
  seed: 5471
  structures: false
files:
  stagewright-peer-test.txt: "the game"
peers:
  b:
    files:
      stagewright-peer-test.txt: "peer b"
