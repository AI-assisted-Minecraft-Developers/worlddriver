// Applied by each mod module (:api, :common, :fabric, :neoforge) after its loader plugin: jar names, Java 21,
// the licence files, publishing, the game JVM flags and the shipped-jar check. See docs/dev/build.md.
plugins {
    id 'maven-publish'
}

base {
    // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
    archivesName = "$rootProject.archives_name-$project.name"
}

repositories {
    // StageWright's published modules: `mc_stagewright-api:dev` (testmod compile) and
    // `mc_stagewright-{fabric,neoforge}` (dev runs), from StageWright's CI builds on the
    // Nexus — or from mavenLocal first, for one built here.
    mavenLocal()
    maven {
        name = 'gardelNexus'
        url = 'https://nexus.gardel.top/repository/maven-releases'
        content { includeGroup 'net.magicterra' }
    }
    // Both loader plugins add the repositories Minecraft and their own artifacts come from;
    // only declare others when depending on mods.
}

java {
    withSourcesJar()
    // Compiles and runs the game on 21 whatever JDK runs Gradle itself.
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

// The LGPL, through the GPL sections it incorporates, must travel with the object code. Only the
// jars the build writes itself; loom's remap tasks copy these.
// META-INF rather than the jar root, which on Fabric is one classpath shared by every mod.
tasks.matching {
    it.name in [
        'jar',
        'shadowJar',
        'sourcesJar'
    ]
}.configureEach {
    from(rootProject.files('COPYING', 'COPYING.LESSER')) { into 'META-INF' }
}

// Configure Maven publishing.
publishing {
    publications {
        mavenJava(MavenPublication) {
            // The artifacts are each module's own, attached below once its script has said which jars they are.

            // Without a <licenses> entry a licence scanner reports the artifact as "unknown";
            // url and scm are how a consumer finds the Corresponding Source the LGPL promises.
            pom {
                name = "${rootProject.mod_name} (${project.name})"
                description = rootProject.mod_description
                url = rootProject.mod_source_url
                licenses {
                    license {
                        name = rootProject.mod_license
                        url = rootProject.mod_license_url
                    }
                }
                scm {
                    url = rootProject.mod_source_url
                    connection = "scm:git:${rootProject.mod_source_url}.git"
                    developerConnection = "scm:git:${rootProject.mod_scm_url}"
                }
            }

            // Everything a consumer needs at runtime is in the jar: Rhino shaded and relocated,
            // netty-codec-http nested via Jar-in-Jar. The published
            // POM must not re-declare them: a consumer that naively resolves
            // the POM would put a SECOND copy of Rhino on its classpath
            // (docs/archive/feedback/2026-06-04-first-external-consumer-winefoxs.md).
            pom.withXml {
                def deps = asNode().dependencies
                if (!deps.isEmpty()) {
                    asNode().remove(deps.first())
                }
            }
        }
    }

    // artifactId and the artifacts are read after the module's own script has run, which sets the names
    // this plugin cannot know when it is applied.
    //
    // Each module's script names its jars: `shippedJar`, the plain artifact (a loader's mod jar; :api's is
    // attached by :fabric, which remaps it), and `devJar`, the `dev` classifier in Mojang names, which
    // StageWright compiles against. See docs/dev/api-artifacts.md.
    afterEvaluate {
        publishing.publications.named('mavenJava') {
            artifactId = base.archivesName.get()
            if (project.ext.has('shippedJar')) {
                artifact(project.ext.shippedJar)
            }
            artifact(project.ext.devJar) { classifier = 'dev' }
            artifact(project.ext.has('sourcesJarTask') ? project.ext.sourcesJarTask : tasks.named('sourcesJar')) {
                classifier = 'sources'
            }
        }
    }

    // Gradle consumers prefer .module metadata over the POM, and the
    // runtimeElements variant leaks the same Rhino dependency there.
    // Publish POM-only so the cleaned POM is the single source of truth.
    tasks.withType(GenerateModuleMetadata).configureEach {
        enabled = false
    }

    repositories {
        // Where publications go, not where dependencies come from.
        mavenLocal()
        // Where CI publishes each build. The credentials are taken from the environment as this
        // is configured, and only a task that publishes here needs them.
        maven {
            name = 'gardelNexus'
            url = 'https://nexus.gardel.top/repository/maven-releases'
            credentials {
                username = System.getenv('MAVEN_USERNAME')
                password = System.getenv('MAVEN_PASSWORD')
            }
        }
    }
}

// A release version cannot be deployed twice, so a local build that got here would stay forever
// under a name no CI build can replace. Failed loudly: skipping would read as a published build.
def published = project.version.toString()
tasks.withType(PublishToMavenRepository)
        .matching {
            it.name.endsWith('ToGardelNexusRepository')
        }.configureEach {
            doFirst {
                if (!(published ==~ /.*-alpha\.[0-9]+\+.*/)) {
                    throw new GradleException("${published} is not published to the Nexus: only a build"
                    + " numbered by BUILD_NUMBER goes there."
                    + " Use publishToMavenLocal for a local build.")
                }
            }
        }

// -PtestkitCoverageAgent=<jar>=<options>: attach that -javaagent (e.g. JaCoCo's) to every game JVM.
// What it writes and any report made from it are the caller's business.
// ---- Debugger hook: opt-in JDWP agent for every game JVM, test suites included; see docs/dev/debugging.md ----
// -PworlddriverJdwp=<port> (or env ORG_GRADLE_PROJECT_worlddriverJdwp); `0` lets the OS pick a port.
// -PworlddriverVmArgs="-Da=b -Dc=d": extra JVM flags for every game JVM (e.g. a system GLFW).
def gameJvmArgs = []
providers.gradleProperty('testkitCoverageAgent').orNull?.with {
    gameJvmArgs << "-javaagent:${it}".toString()
}
providers.gradleProperty('worlddriverJdwp').orNull?.with {
    gameJvmArgs << "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=127.0.0.1:${it}".toString()
}
providers.gradleProperty('worlddriverVmArgs').orNull?.with {
    gameJvmArgs.addAll(it.trim().split(/\s+/))
}
// One hook per loader plugin, as each names its runs and their JVM flags differently.
plugins.withId('fabric-loom') {
    loom.runs.configureEach { run -> gameJvmArgs.each { run.vmArg it } }
}
plugins.withId('net.neoforged.moddev') {
    neoForge.runs.configureEach { run ->
        gameJvmArgs.each {
            run.jvmArgument it
        }
    }
}

// The shipped jars carry no test framework or fixture; the source rules are in ArchitectureTest.
def verifyJarContents = tasks.register('verifyJarContents') {
    dependsOn 'assemble'
    def libs = layout.buildDirectory.dir('libs')
    doLast {
        def banned = [
            'net/magicterra/stagewright/',
            'net/magicterra/worlddriver/testcontent/',
            'net/magicterra/worlddriver/bot/stagewright/'
        ]
        def bad = []
        libs.get().asFile.listFiles()?.findAll {
            it.name.endsWith('.jar') && !it.name.contains('-sources') && !it.name.contains('-dev-shadow')
        }?.each { jar ->
            new java.util.zip.ZipFile(jar).withCloseable { zip ->
                zip.entries().each { e ->
                    if (banned.any {
                                e.name.startsWith(it)
                            }) {
                        bad << "${jar.name}: ${e.name}"
                    }
                }
            }
        }
        if (bad) {
            throw new GradleException('shipped test framework or fixture:\n  ' + bad.join('\n  '))
        }
    }
}
tasks.named('build') { dependsOn verifyJarContents }
