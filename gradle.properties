# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Mod properties (group preserved per user instruction)
mod_version = 0.1.0+1.21.1
maven_group = net.magicterra
archives_name = agent_driver
enabled_platforms = fabric,neoforge

mod_id = agent_driver
mod_name = AgentDriver
mod_license = MIT
mod_authors = AI-assisted-Minecraft-Developers
mod_description = AI agent driver: Minecraft observation, action and Rhino scripting over an in-game RPC channel.

# Minecraft platform versions
minecraft_version = 1.21.1
minecraft_version_range = [1.21.1,1.22)
loader_version_range = [4,)

# Loader-specific versions
architectury_api_version = 13.0.8
fabric_loader_version = 0.16.14
fabric_api_version = 0.116.4+1.21.1
neoforge_version = 21.1.230
neoforge_version_range = [21,)

# Embedded Rhino (KubeJS-Mods fork)
rhino_version = 2101.2.7-build.81

# netty-codec-http (WebSocket support). MC 1.21.1 ships netty-codec/transport but
# NOT netty-codec-http, so we bring it in compile-only on common, route it through
# forgeRuntimeLibrary on neoforge (FML bootstrap classpath), and shadow-bundle into
# the prod jar.
netty_version = 4.1.97.Final

# snakeyaml — parses the YAML GameTest definitions (docs/yaml-gametest.md). MC /
# NeoForge 1.21.1 do NOT ship it (Forge configs use night-config/TOML), so we
# bundle it like netty. Unlike Rhino (unique package) and netty (MC ships a
# compatible version), snakeyaml is a high-collision library, so it is the one
# dependency we shadow-RELOCATE (to net.magicterra.agent.shaded.snakeyaml) to
# avoid clashing with a modpack mod that bundles its own copy unrelocated.
snakeyaml_version = 2.4
