# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Mod properties (group preserved per user instruction)
# The version is <this>-alpha.<n>+<minecraft_version>; see the root build.gradle.
mod_base_version = 0.1.0
maven_group = net.magicterra
archives_name = worlddriver

mod_id = worlddriver
mod_name = WorldDriver
mod_license = LGPL-3.0-only
mod_license_url = https://www.gnu.org/licenses/lgpl-3.0.txt
# Where the Corresponding Source lives: the published POMs' url and scm, and both loaders' mod
# metadata, point here.
mod_source_url = https://github.com/AI-assisted-Minecraft-Developers/worlddriver
mod_scm_url = git@github.com:AI-assisted-Minecraft-Developers/worlddriver.git
mod_authors = AI-assisted-Minecraft-Developers
mod_description = Exposes the running game as a programmable control surface: observation, action and Rhino scripting over one API, reachable via MCP, WebSocket RPC or in-JVM script.

# Minecraft platform versions. The range is a Maven interval; fabric/build.gradle translates it
# for fabric.mod.json, and the Fabric Loader floor there is fabric_loader_version.
minecraft_version = 1.21.1
minecraft_version_range = [1.21.1,1.22)
loader_version_range = [4,)

# Loader-specific versions
fabric_loader_version = 0.16.14
fabric_api_version = 0.116.4+1.21.1
neoforge_version = 21.1.230
neoforge_version_range = [21,)
# The vanilla :api and :common compile against: the NeoForm NeoForge $neoforge_version is built on.
neoform_version = 1.21.1-20240808.144430
# The Mixin :common's mixins compile against; at run time each loader brings its own.
mixin_version = 0.8.5

# Embedded Rhino (KubeJS-Mods fork)
rhino_version = 2101.2.7-build.81

# netty-codec-http (WebSocket support). MC 1.21.1 ships netty-codec/transport but
# NOT netty-codec-http, so we bring it in compile-only on common, put it on the game's
# classpath in NeoForge dev runs (additionalRuntimeClasspath), and nest it into each
# loader's jar (`include` / `jarJar`, transitive=false → only codec-http ships).
netty_version = 4.1.97.Final


# ---- StageWright ------------------------------------------------------------
# The in-game test framework, its own repository since 2026-08-02 and consumed here
# purely as published artifacts:
#   net.magicterra:mc_stagewright-api:<version>:dev   testmod compile (test API)
#   net.magicterra:mc_stagewright-{fabric,neoforge}   dev-run classpath, never shipped
# The `dev` classifier is the NAMED-mappings jar; the plain one is remapped to
# intermediary and will not link against a dev-mapped compile classpath.
#
# One version for those and for the gradle plugin: a build StageWright's CI published to the
# Nexus. Moving to a newer one is a commit here. Override with
# -Pstagewright_version=0.1.0-snapshot+1.21.1 to use a StageWright published to mavenLocal.
stagewright_version = 0.1.0-alpha.0+1.21.1
