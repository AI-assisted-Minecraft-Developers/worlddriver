# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Mod properties (group preserved per user instruction)
mod_version = 0.1.0+1.21.1
maven_group = net.magicterra
archives_name = worlddriver
enabled_platforms = fabric,neoforge

mod_id = worlddriver
mod_name = WorldDriver
mod_license = MIT
mod_authors = AI-assisted-Minecraft-Developers
mod_description = Exposes the running game as a programmable control surface: observation, action and Rhino scripting over one API, reachable via MCP, WebSocket RPC or in-JVM script.

# Minecraft platform versions
minecraft_version = 1.21.1
minecraft_version_range = [1.21.1,1.22)
loader_version_range = [4,)

# Loader-specific versions
fabric_loader_version = 0.16.14
fabric_api_version = 0.116.4+1.21.1
neoforge_version = 21.1.230
neoforge_version_range = [21,)

# Embedded Rhino (KubeJS-Mods fork)
rhino_version = 2101.2.7-build.81

# netty-codec-http (WebSocket support). MC 1.21.1 ships netty-codec/transport but
# NOT netty-codec-http, so we bring it in compile-only on common, route it through
# forgeRuntimeLibrary on neoforge (FML bootstrap classpath), and nest it into the
# prod jar via Jar-in-Jar (`include`, transitive=false → only codec-http ships).
netty_version = 4.1.97.Final


# ---- StageWright ------------------------------------------------------------
# The in-game test framework, its own repository since 2026-08-02 and consumed here
# purely as published artifacts:
#   net.magicterra:mc_stagewright-api:<version>:dev   testmod compile (scene SPI)
#   net.magicterra:mc_stagewright-{fabric,neoforge}   dev-run classpath, never shipped
# The `dev` classifier is the NAMED-mappings jar; the plain one is remapped to
# intermediary and will not link against a dev-mapped compile classpath.
stagewright_version = 0.1.0+1.21.1

# The gradle plugin is versioned separately — it carries no Minecraft classpath, so it
# does not move with the Minecraft version the way the mod modules do.
stagewright_plugin_version = 0.1.0
