// Generates each @Spec interface's caller and registry entries while :api compiles; see
// docs/dev/java-api.md. On :api's annotationProcessor path only, so nothing here reaches a jar or a POM.
// Also published, for StageWright's own @Spec interfaces.
plugins {
    id 'worlddriver.base'
    id 'java'
    id 'maven-publish'
    id 'worlddriver.nexus'
}

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

dependencies {
    implementation 'com.palantir.javapoet:javapoet:0.20.0'
    compileOnly 'com.google.auto.service:auto-service-annotations:1.1.1'
    annotationProcessor 'com.google.auto.service:auto-service:1.1.1'

    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging { events "failed" }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'worlddriver-api-processor'
            from components.java
        }
    }
    repositories { mavenLocal() }
}
