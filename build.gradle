plugins {
    // :fabric builds with Fabric Loom; :api, :common and :neoforge with ModDevGradle. Loom is the newest on Gradle 8,
    // as StageWright's plugin cannot run the suites on Gradle 9 yet. See docs/dev/build.md.
    id 'fabric-loom' version '1.13.6' apply false
    id 'net.neoforged.moddev' version '2.0.141' apply false
    // Shadow 9: 8.x unpacks the nested jars ModDevGradle's jarJar adds to the NeoForge jar.
    id 'com.gradleup.shadow' version '9.2.2' apply false
    id 'com.github.node-gradle.node' version '7.1.0' apply false
    // The StageWright plugin (resolved from mavenLocal, wired in settings.gradle): the in-game test suites below.
    id 'net.magicterra.stagewright'
}

stagewright {
    // The JUnit tests in the testmod, run in the game per scene: stagewrightTestFabric, stagewrightTestNeoforge.
    // The plugin declares their runs in each loader's Loom or ModDevGradle, under <loader>/run-stagewright/<suite>/, and puts the
    // StageWright mod on every run of the loader's testmod source set. A clean box publishing :common before
    // StageWright exists (-PworlddriverBootstrap) declares none, so nothing asks for it.
    tests {
        if (!providers.gradleProperty('worlddriverBootstrap').isPresent()) {
            // The tests are the plugin's default: the loader's testmod, which compiles :common's testmod sources.
            ['fabric', 'neoforge'].each { loader ->
                create(loader) {
                    loaderProject = ":${loader}"
                    includeWorldDriver = false
                    // Architectury's dev-time transformer leaves thread pools that hold the JVM; goes with it.
                    leaks = 'report'
                    jvmArgs.add('-Xmx2g')
                    systemProperties.putAll(['worlddriver.rpcPort': '0', 'worlddriver.mcpPort': '0'])
                    // -PstagewrightServerPort lets two checkouts run their suites at once.
                    def port = providers.gradleProperty('stagewrightServerPort')
                    if (port.isPresent()) serverPort = port.get() as int
                }
            }
        }
    }
}

// Republished StageWright reaching the run: Gradle's cache by `changing` and the zero TTL below; loom's remap
// cache, keyed on coordinates, by the StageWright plugin, which drops stale remaps as it is applied.

// <base>-alpha.<n>+<minecraft>. CI sets BUILD_NUMBER to its run number; without it the build is
// <base>-snapshot+<minecraft>, which is never published to the Nexus. Gradle, Fabric and NeoForge
// order these forms alike, which `build` and uppercase `SNAPSHOT` are not (StageWright's
// docs/reference/publishing.md, Versions).
def buildNumber = providers.environmentVariable('BUILD_NUMBER').orNull
// Refused rather than spliced in: `alpha.<n>` has to be a SemVer numeric identifier, digits with no
// leading zero, for the version to be valid SemVer and order by run number.
if (buildNumber != null && !(buildNumber ==~ /0|[1-9][0-9]*/)) {
    throw new GradleException("BUILD_NUMBER is '${buildNumber}', but it must be a whole number"
            + " without leading zeros; unset it for a local build")
}
ext.worlddriverVersion = "${mod_base_version}-${buildNumber != null ? "alpha.${buildNumber}" : 'snapshot'}+${minecraft_version}".toString()

allprojects {
    group = rootProject.maven_group
    version = rootProject.worlddriverVersion

    configurations.all {
        resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
    }
}

// The root runs the stagewrightTest* tasks, which resolve StageWright's test engine and the libraries it uses.
repositories {
    mavenLocal()
    maven {
        name = 'gardelNexus'
        url = 'https://nexus.gardel.top/repository/maven-releases'
        content { includeGroup 'net.magicterra' }
    }
    mavenCentral()
}

// The mod modules; :api-processor is a plain javac plugin and takes none of this.
def modProjects = subprojects.findAll { it.name != 'api-processor' }

configure(modProjects) {
    apply plugin: project.name == 'fabric' ? 'fabric-loom' : 'net.neoforged.moddev'
    apply plugin: 'maven-publish'

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        // StageWright's published modules: `mc_stagewright-api:dev` (testmod compile) and
        // `mc_stagewright-{fabric,neoforge}` (dev runs), from StageWright's CI builds on the
        // Nexus — or from mavenLocal first, for one built here.
        mavenLocal()
        maven {
            name = 'gardelNexus'
            url = 'https://nexus.gardel.top/repository/maven-releases'
            content { includeGroup 'net.magicterra' }
        }
        // Both loader plugins add the repositories Minecraft and their own artifacts come from;
        // only declare others when depending on mods.
    }

    java {
        withSourcesJar()
        // Compiles and runs the game on 21 whatever JDK runs Gradle itself.
        toolchain.languageVersion = JavaLanguageVersion.of(21)
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
    }

    // The LGPL, through the GPL sections it incorporates, must travel with the object code. Only the
    // jars the build writes itself; loom's remap tasks copy these.
    // META-INF rather than the jar root, which on Fabric is one classpath shared by every mod.
    tasks.matching { it.name in ['jar', 'shadowJar', 'sourcesJar'] }.configureEach {
        from(rootProject.files('COPYING', 'COPYING.LESSER')) { into 'META-INF' }
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                // The artifacts are each module's own, attached below once its script has said which jars they are.

                // Without a <licenses> entry a licence scanner reports the artifact as "unknown";
                // url and scm are how a consumer finds the Corresponding Source the LGPL promises.
                pom {
                    name = "${rootProject.mod_name} (${project.name})"
                    description = rootProject.mod_description
                    url = rootProject.mod_source_url
                    licenses {
                        license {
                            name = rootProject.mod_license
                            url = rootProject.mod_license_url
                        }
                    }
                    scm {
                        url = rootProject.mod_source_url
                        connection = "scm:git:${rootProject.mod_source_url}.git"
                        developerConnection = "scm:git:${rootProject.mod_scm_url}"
                    }
                }

                // Everything a consumer needs at runtime is in the jar: Rhino shaded and relocated,
                // netty-codec-http nested via Jar-in-Jar. The published
                // POM must not re-declare them: a consumer that naively resolves
                // the POM would put a SECOND copy of Rhino on its classpath
                // (docs/archive/feedback/2026-06-04-first-external-consumer-winefoxs.md).
                pom.withXml {
                    def deps = asNode().dependencies
                    if (!deps.isEmpty()) asNode().remove(deps.first())
                }
            }
        }

        // artifactId must be resolved AFTER the subproject's own build script has
        // run: this subprojects{} block executes BEFORE child scripts, so an eager
        // `base.archivesName.get()` here captured the root default and the
        // stagewright modules' own `archivesName = 'mc_testkit-*'` overrides never
        // reached the publication (P3b finding: they published as
        // worlddriver-testkit-* instead). afterEvaluate defers the read until the
        // child's overrides are in place.
        //
        // Each module's script names its jars: `shippedJar`, the plain artifact (a loader's mod jar; :api's is
        // attached by :fabric, which remaps it), and `devJar`, the `dev` classifier in Mojang names, which
        // StageWright compiles against. See docs/dev/api-artifacts.md.
        afterEvaluate {
            publishing.publications.named('mavenJava') {
                artifactId = base.archivesName.get()
                if (project.ext.has('shippedJar')) artifact(project.ext.shippedJar)
                artifact(project.ext.devJar) { classifier = 'dev' }
                artifact(project.ext.has('sourcesJarTask') ? project.ext.sourcesJarTask : tasks.named('sourcesJar')) {
                    classifier = 'sources'
                }
            }
        }

        // Gradle consumers prefer .module metadata over the POM, and the
        // runtimeElements variant leaks the same Rhino dependency there.
        // Publish POM-only so the cleaned POM is the single source of truth.
        tasks.withType(GenerateModuleMetadata).configureEach {
            enabled = false
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
            mavenLocal()
            // Where CI publishes each build. The credentials are taken from the environment as this
            // is configured, and only a task that publishes here needs them.
            maven {
                name = 'gardelNexus'
                url = 'https://nexus.gardel.top/repository/maven-releases'
                credentials {
                    username = System.getenv('MAVEN_USERNAME')
                    password = System.getenv('MAVEN_PASSWORD')
                }
            }
        }
    }

    // A release version cannot be deployed twice, so a local build that got here would stay forever
    // under a name no CI build can replace. Failed loudly: skipping would read as a published build.
    def published = rootProject.worlddriverVersion
    tasks.withType(PublishToMavenRepository)
            .matching { it.name.endsWith('ToGardelNexusRepository') }.configureEach {
        doFirst {
            if (!(published ==~ /.*-alpha\.[0-9]+\+.*/)) {
                throw new GradleException("${published} is not published to the Nexus: only a build"
                        + " numbered by BUILD_NUMBER goes there."
                        + " Use publishToMavenLocal for a local build.")
            }
        }
    }
}

// ---- Coverage hook: opt-in jacoco agent for every game JVM. ----
// Pass the FULL -javaagent value via the project property `testkitCoverageAgent`
// (normally through the env var ORG_GRADLE_PROJECT_testkitCoverageAgent, which the
// gradle CLIENT forwards into the build regardless of daemon staleness — a plain
// JAVA_TOOL_OPTIONS on the orchestrator does NOT reach game JVMs forked by an
// already-running daemon; that null-measured as 0% across the board on 2026-07-19).
// Example value:
//   /abs/.local/jacoco/org.jacoco.agent-0.8.12-runtime.jar=destfile=/abs/coverage-out/game.exec,includes=net.magicterra.*
//
// ---- Debugger hook: opt-in JDWP agent for every game JVM, test suites included; see docs/dev/debugging.md ----
// -PworlddriverJdwp=<port> (or env ORG_GRADLE_PROJECT_worlddriverJdwp); `0` lets the OS pick a port.
// -PworlddriverVmArgs="-Da=b -Dc=d": extra JVM flags for every game JVM (e.g. a system GLFW).
def gameJvmArgs = []
providers.gradleProperty('testkitCoverageAgent').orNull?.with { gameJvmArgs << "-javaagent:${it}".toString() }
providers.gradleProperty('worlddriverJdwp').orNull?.with {
    gameJvmArgs << "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=127.0.0.1:${it}".toString()
}
providers.gradleProperty('worlddriverVmArgs').orNull?.with { gameJvmArgs.addAll(it.trim().split(/\s+/)) }
// One hook per loader plugin, as each names its runs and their JVM flags differently.
subprojects {
    plugins.withId('fabric-loom') {
        loom.runs.configureEach { run -> gameJvmArgs.each { run.vmArg it } }
    }
    plugins.withId('net.neoforged.moddev') {
        neoForge.runs.configureEach { run -> gameJvmArgs.each { run.jvmArgument it } }
    }
}

// The shipped jars carry no test framework or fixture; the source rules are in ArchitectureTest.
configure(modProjects) {
    def verifyJarContents = tasks.register('verifyJarContents') {
        dependsOn 'assemble'
        def libs = layout.buildDirectory.dir('libs')
        doLast {
            def banned = ['net/magicterra/stagewright/', 'net/magicterra/worlddriver/testcontent/',
                          'net/magicterra/worlddriver/bot/stagewright/']
            def bad = []
            libs.get().asFile.listFiles()?.findAll {
                it.name.endsWith('.jar') && !it.name.contains('-sources') && !it.name.contains('-dev-shadow')
            }?.each { jar ->
                new java.util.zip.ZipFile(jar).withCloseable { zip ->
                    zip.entries().each { e ->
                        if (banned.any { e.name.startsWith(it) }) bad << "${jar.name}: ${e.name}"
                    }
                }
            }
            if (bad) throw new GradleException('shipped test framework or fixture:\n  ' + bad.join('\n  '))
        }
    }
    tasks.named('build') { dependsOn verifyJarContents }
}
