plugins {
    id 'dev.architectury.loom' version '1.11-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.gradleup.shadow' version '8.3.6' apply false
    // First dogfood consumer of the stagewright gradle plugin (resolved from mavenLocal, wired in
    // settings.gradle). Registers one `stagewright<Topology>` task per entry in the block below,
    // each provisioning a clean run directory, running the loader subproject's own dogfood run task
    // and judging its results. Applying it is negligible at configuration time (lazy registration).
    id 'net.magicterra.stagewright'
}

architectury {
    minecraft = project.minecraft_version
}

// Dogfood consumer configuration for the stagewright gradle plugin.
//
// One task per (gate, loader) pair rather than one task plus a `-Pstagewright.loader` switch. The
// switch existed because the plugin used to shell a python orchestrator that took `--loader`; now
// that a topology IS a run task plus a results file plus an expect-file, and all three differ per
// loader, a single parameterised task would just be three topologies wearing one name — and the
// pair that actually needs running together (both loaders, proving byte-identity) could not be
// asked for in one invocation.
//
//   ./gradlew stagewrightDedicatedServerFabric stagewrightDedicatedServerNeoforge     # both loaders, one command
//
// `virtualDisplay` is on for every topology whose run task is a client. It is a no-op wherever a
// DISPLAY already exists, so a developer on a desktop gets their own screen and the headless Linux
// host gets an Xvfb the build starts and stops — the one job t1.py/t2.py did that had nothing to do
// with Minecraft.
stagewright {
    topologies {
        dedicatedServerFabric {
            runTask = ':fabric:runDogfoodServer'
            gameDirectory = file('fabric/run-dogfood')
            expectFile = file('scripts/stagewright/expected-scenes-fabric.txt')
            // 165 scenes, several of which walk a bot across real terrain. The default 20 exists to
            // cut short a game that never armed; this suite legitimately runs longer than that.
            timeoutMinutes = 45
        }
        dedicatedServerNeoforge {
            runTask = ':neoforge:runDogfoodServer'
            gameDirectory = file('neoforge/run-dogfood')
            expectFile = file('scripts/stagewright/expected-scenes-neoforge.txt')
            timeoutMinutes = 45
        }
        integratedServerFabric {
            runTask = ':fabric:runStagewrightIntegratedServer'
            gameDirectory = file('fabric/run-stagewright-integrated')
            expectFile = file('scripts/stagewright/expected-scenes-fabric.txt')
            virtualDisplay = true
            timeoutMinutes = 45
        }
        integratedServerNeoforge {
            runTask = ':neoforge:runStagewrightIntegratedServer'
            gameDirectory = file('neoforge/run-stagewright-integrated')
            expectFile = file('scripts/stagewright/expected-scenes-neoforge.txt')
            virtualDisplay = true
            timeoutMinutes = 45
        }
        dedicatedServerWithClientFabric {
            runTask = ':fabric:runStagewrightDedicatedServerWithClient'
            companionRunTask = ':fabric:runStagewrightJoiningClient'
            gameDirectory = file('fabric/run-stagewright-with-client')
            expectFile = file('scripts/stagewright/expected-scenes-fabric.txt')
            virtualDisplay = true
            timeoutMinutes = 45
        }
        dedicatedServerWithClientNeoforge {
            runTask = ':neoforge:runStagewrightDedicatedServerWithClient'
            companionRunTask = ':neoforge:runStagewrightJoiningClient'
            gameDirectory = file('neoforge/run-stagewright-with-client')
            expectFile = file('scripts/stagewright/expected-scenes-neoforge.txt')
            virtualDisplay = true
            timeoutMinutes = 45
        }
    }
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        // StageWright's published modules. Required, not a convenience: since the repo
        // split the framework is not a subproject here, so `mc_stagewright-api:dev` (testmod
        // compile) and `mc_stagewright-{fabric,neoforge}` (dev runs) have nowhere else to
        // come from. Local until the artifacts are on a real remote.
        mavenLocal()
        // Loom adds the essential maven repositories to download Minecraft and libraries
        // from automatically; only declare others when depending on mods.
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.officialMojangMappings()
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java

                // ---- `dev` classifier: the NAMED-mappings jar, for cross-repo compilation ----
                // components.java publishes loom's REMAPPED artifact, whose Minecraft references
                // are intermediary (net/minecraft/class_1291). That is correct for shipping and
                // useless for compiling: a consumer building in a dev environment resolves against
                // named/mojmap (net/minecraft/core/BlockPos), so linking the published jar directly
                // fails on every Minecraft-touching signature.
                //
                // Inside one Gradle build, consumers dodge this via
                // `project(path: ':x', configuration: 'namedElements')`. That configuration has no
                // published equivalent — so publish the artifact it points at. Loom already builds
                // it (build/devlibs/<name>-dev.jar); this only stops it being thrown away.
                //
                // Needed in BOTH directions once StageWright and WorldDriver are separate repos:
                // stagewright-common compiles against worlddriver-common:dev, and worlddriver's
                // testmod compiles against mc_stagewright-api:dev. Attached as a classifier rather
                // than a second publication so the coordinates stay one artifact with two faces —
                // `:dev` for compiling, plain for shipping — and no POM claims a dependency on it.
                artifact(tasks.named('jar')) { classifier = 'dev' }

                // Everything a consumer needs at runtime (Rhino, netty-codec-http)
                // is nested in the jar via Jar-in-Jar, so the published
                // POM must not re-declare them: a consumer that naively resolves
                // the POM would put a SECOND copy of Rhino on its classpath
                // (docs/feedback/2026-06-04, bug #2).
                pom.withXml {
                    def deps = asNode().dependencies
                    if (!deps.isEmpty()) asNode().remove(deps.first())
                }
            }
        }

        // artifactId must be resolved AFTER the subproject's own build script has
        // run: this subprojects{} block executes BEFORE child scripts, so an eager
        // `base.archivesName.get()` here captured the root default and the
        // stagewright modules' own `archivesName = 'mc_testkit-*'` overrides never
        // reached the publication (P3b finding: they published as
        // worlddriver-testkit-* instead). afterEvaluate defers the read until the
        // child's overrides are in place.
        afterEvaluate {
            publishing.publications.named('mavenJava') {
                artifactId = base.archivesName.get()
            }
        }

        // Gradle consumers prefer .module metadata over the POM, and the
        // runtimeElements variant leaks the same Rhino dependency there.
        // Publish POM-only so the cleaned POM is the single source of truth.
        tasks.withType(GenerateModuleMetadata).configureEach {
            enabled = false
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
            mavenLocal()
        }
    }
}

// ---- Coverage hook (task#95a): opt-in jacoco agent for every loom game JVM. ----
// Pass the FULL -javaagent value via the project property `testkitCoverageAgent`
// (normally through the env var ORG_GRADLE_PROJECT_testkitCoverageAgent, which the
// gradle CLIENT forwards into the build regardless of daemon staleness — a plain
// JAVA_TOOL_OPTIONS on the orchestrator does NOT reach game JVMs forked by an
// already-running daemon; that null-measured as 0% across the board on 2026-07-19).
// Example value:
//   /abs/.local/jacoco/org.jacoco.agent-0.8.12-runtime.jar=destfile=/abs/coverage-out/t0.exec,includes=net.magicterra.*
subprojects {
    plugins.withId('dev.architectury.loom') {
        def cov = providers.gradleProperty('testkitCoverageAgent')
        if (cov.isPresent()) {
            loom.runs.configureEach {
                vmArg "-javaagent:${cov.get()}"
            }
        }
    }
}
