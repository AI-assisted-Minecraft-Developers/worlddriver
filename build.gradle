plugins {
    // :fabric builds with Fabric Loom; :api, :common and :neoforge with ModDevGradle. Loom is the newest on Gradle 8,
    // as StageWright's plugin cannot run the suites on Gradle 9 yet. See docs/dev/build.md.
    id 'fabric-loom' version '1.13.6' apply false
    id 'net.neoforged.moddev' version '2.0.141' apply false
    // Shadow 9: 8.x unpacks the nested jars ModDevGradle's jarJar adds to the NeoForge jar.
    id 'com.gradleup.shadow' version '9.2.2' apply false
    id 'com.github.node-gradle.node' version '7.1.0' apply false
    // The StageWright plugin (resolved from mavenLocal, wired in settings.gradle): the in-game test suites below.
    id 'net.magicterra.stagewright'
    // Spotless, Checkstyle and PMD (build-logic): docs/dev/code-style.md.
    id 'worlddriver.lint'
    // The version and the dependency cache policy every project shares (build-logic).
    id 'worlddriver.base'
}

// Each project's own configuration is in its build script and the build-logic plugins it applies; see
// docs/dev/build.md. What is left here is the root project's: the in-game test suites it runs.

stagewright {
    // The JUnit tests in the testmod, run in the game per scene: stagewrightTestFabric, stagewrightTestNeoforge.
    // The plugin declares their runs in each loader's Loom or ModDevGradle, under <loader>/run-stagewright/<suite>/, and puts the
    // StageWright mod on every run of the loader's testmod source set. A clean box publishing :common before
    // StageWright exists (-PworlddriverBootstrap) declares none, so nothing asks for it.
    tests {
        if (!providers.gradleProperty('worlddriverBootstrap').isPresent()) {
            // The tests are the plugin's default: the loader's testmod, which compiles :common's testmod sources.
            ['fabric', 'neoforge'].each { loader ->
                create(loader) {
                    loaderProject = ":${loader}"
                    includeWorldDriver = false
                    jvmArgs.add('-Xmx2g')
                    systemProperties.putAll(['worlddriver.rpcPort': '0', 'worlddriver.mcpPort': '0'])
                    // -PstagewrightServerPort lets two checkouts run their suites at once.
                    def port = providers.gradleProperty('stagewrightServerPort')
                    if (port.isPresent()) serverPort = port.get() as int
                }
            }
        }
    }
}

// The root runs the stagewrightTest* tasks, which resolve StageWright's test engine and the libraries it uses.
repositories {
    mavenLocal()
    maven {
        name = 'gardelNexus'
        url = 'https://nexus.gardel.top/repository/maven-releases'
        content { includeGroup 'net.magicterra' }
    }
    mavenCentral()
}
