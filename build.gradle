plugins {
    id 'dev.architectury.loom' version '1.11-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.gradleup.shadow' version '8.3.6' apply false
    // First dogfood consumer of the stagewright gradle plugin (included build wired
    // in settings.gradle). Registers stagewrightServer/stagewrightClient/stagewrightE2E on the
    // ROOT project, each shelling the frozen python orchestration contract. Applying
    // it is negligible at configuration time (lazy task registration).
    id 'net.magicterra.stagewright'
}

architectury {
    minecraft = project.minecraft_version
}

// Dogfood consumer configuration for the stagewright gradle plugin. The plugin's
// only loader-override mechanism is the `stagewright { loader }` extension (there is
// no built-in `-P` binding); this bridge threads the `stagewright.loader` project
// property onto it so the documented gate-1 command works —
//   ./gradlew stagewrightServer -Pstagewright.loader=neoforge
// selects the neoforge dogfood — while the fabric convention stays the default
// (so `./gradlew stagewrightClient` remains fabric T1). Loader-invalid values are
// left for the orchestrator (t0/t1/t2.py) to reject at its --loader boundary.
stagewright {
    loader = (findProperty('stagewright.loader') ?: 'fabric')
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    // stagewright-junit is a pure-JVM JUnit 5 attach module (out-of-process RPC consumer):
    // no Minecraft, no loader, no loom. It provides its own java-library setup in
    // stagewright/junit/build.gradle. Scope it out of the loom/architectury/MC pipeline
    // that every other subproject shares. (group/version still come from allprojects.)
    if (project.name == 'stagewright-junit') return

    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        // Add repositories to retrieve artifacts from in here.
        // You should only use this when depending on other mods because
        // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
        // See https://docs.gradle.org/current/userguide/declaring_repositories.html
        // for more information about repositories.
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.officialMojangMappings()
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java
                // Everything a consumer needs at runtime (Rhino, netty-codec-http,
                // snakeyaml) is nested in the jar via Jar-in-Jar, so the published
                // POM must not re-declare them: a consumer that naively resolves
                // the POM would put a SECOND copy of Rhino on its classpath
                // (docs/feedback/2026-06-04, bug #2).
                pom.withXml {
                    def deps = asNode().dependencies
                    if (!deps.isEmpty()) asNode().remove(deps.first())
                }
            }
        }

        // artifactId must be resolved AFTER the subproject's own build script has
        // run: this subprojects{} block executes BEFORE child scripts, so an eager
        // `base.archivesName.get()` here captured the root default and the
        // stagewright modules' own `archivesName = 'mc_testkit-*'` overrides never
        // reached the publication (P3b finding: they published as
        // worlddriver-testkit-* instead). afterEvaluate defers the read until the
        // child's overrides are in place.
        afterEvaluate {
            publishing.publications.named('mavenJava') {
                artifactId = base.archivesName.get()
            }
        }

        // Gradle consumers prefer .module metadata over the POM, and the
        // runtimeElements variant leaks the same Rhino dependency there.
        // Publish POM-only so the cleaned POM is the single source of truth.
        tasks.withType(GenerateModuleMetadata).configureEach {
            enabled = false
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
            mavenLocal()
        }
    }
}

// ---- Coverage hook (task#95a): opt-in jacoco agent for every loom game JVM. ----
// Pass the FULL -javaagent value via the project property `testkitCoverageAgent`
// (normally through the env var ORG_GRADLE_PROJECT_testkitCoverageAgent, which the
// gradle CLIENT forwards into the build regardless of daemon staleness — a plain
// JAVA_TOOL_OPTIONS on the orchestrator does NOT reach game JVMs forked by an
// already-running daemon; that null-measured as 0% across the board on 2026-07-19).
// Example value:
//   /abs/.local/jacoco/org.jacoco.agent-0.8.12-runtime.jar=destfile=/abs/coverage-out/t0.exec,includes=net.magicterra.*
subprojects {
    plugins.withId('dev.architectury.loom') {
        def cov = providers.gradleProperty('testkitCoverageAgent')
        if (cov.isPresent()) {
            loom.runs.configureEach {
                vmArg "-javaagent:${cov.get()}"
            }
        }
    }
}
