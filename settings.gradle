pluginManagement {
    // Standalone included build for the stagewright gradle plugin (id
    // net.magicterra.stagewright). Being an included build it lives entirely
    // outside the root subprojects{} / loom pipeline; the root build applies it
    // below as the first dogfood consumer. Zero cost when a consumer does not
    // apply the plugin.
    includeBuild('stagewright/gradle-plugin')

    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://files.minecraftforge.net/maven/" }
        gradlePluginPortal()
    }
}

// Root gradle project name. Was 'noteblockapi' — a leftover from the repo's
// original template fork, referenced nowhere; renamed 2026-07-19 to match the
// repository. mod id / archives_name ('worlddriver') live in gradle.properties.
rootProject.name = 'worlddriver'

include 'common'
include 'fabric'
include 'neoforge'
include 'stagewright-common'
include 'stagewright-fabric'
include 'stagewright-neoforge'
include 'stagewright-junit'
project(':stagewright-common').projectDir = file('stagewright/common')
project(':stagewright-fabric').projectDir = file('stagewright/fabric')
project(':stagewright-neoforge').projectDir = file('stagewright/neoforge')
project(':stagewright-junit').projectDir = file('stagewright/junit')
