pluginManagement {
    repositories {
        // StageWright's gradle plugin arrives as a published artifact now, not as an
        // included build: the framework lives in its own repository. Until it is on a real
        // remote that repository is the local one — see the release-order note at the foot
        // of ../stagewright/settings.gradle for how the two builds bootstrap each other.
        mavenLocal()
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://files.minecraftforge.net/maven/" }
        gradlePluginPortal()
    }

    // The version lives here, not in the root `plugins {}` block, which does not accept
    // property interpolation. Keeps build.gradle's `id 'net.magicterra.stagewright'`
    // version-free and the number beside the other coordinates in gradle.properties.
    plugins {
        id 'net.magicterra.stagewright' version "${stagewright_plugin_version}"
    }
}

// Root gradle project name. Was 'noteblockapi' — a leftover from the repo's
// original template fork, referenced nowhere; renamed 2026-07-19 to match the
// repository. mod id / archives_name ('worlddriver') live in gradle.properties.
rootProject.name = 'worlddriver'

include 'common'
include 'fabric'
include 'neoforge'
